name: Pipeline Build

on:
  workflow_run:
    workflows: ["Sync SharpSpring", "Sync Wildix"]
    types:
      - completed
  workflow_dispatch:  # manual trigger

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Test raw MotherDuck connection
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          uv run python -c "
          import duckdb, os
          from urllib.parse import urlencode
          token = os.environ['MOTHERDUCK_TOKEN'].strip()
          print(f'Token length: {len(token)}, starts with: {token[:10]}')

          # Test 1: raw token in URL (same as original dbt approach)
          try:
              conn = duckdb.connect(f'md:trust-pipeline?motherduck_token={token}')
              result = conn.execute('SELECT COUNT(*) FROM bronze.sharpspring_leads').fetchone()
              print(f'Test 1 (raw URL) SUCCESS. Bronze leads: {result[0]}')
              conn.close()
          except Exception as e:
              print(f'Test 1 (raw URL) FAILED: {e}')

          # Test 2: URL-encoded token + custom_user_agent (same as dlt approach)
          try:
              qs = urlencode({'motherduck_token': token})
              conn2 = duckdb.connect(f'md:trust-pipeline?{qs}', config={'custom_user_agent': 'test/1.0'})
              result2 = conn2.execute('SELECT COUNT(*) FROM bronze.sharpspring_leads').fetchone()
              print(f'Test 2 (url-encoded + user-agent) SUCCESS. Bronze leads: {result2[0]}')
              conn2.close()
          except Exception as e:
              print(f'Test 2 (url-encoded + user-agent) FAILED: {e}')
          "

      - name: Run dbt build
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: ${{ secrets.MOTHERDUCK_DATABASE }}
        run: |
          export motherduck_token=$MOTHERDUCK_TOKEN
          uv run dbt build --project-dir dbt_project --profiles-dir dbt_project

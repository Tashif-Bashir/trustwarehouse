name: Pipeline Build

on:
  workflow_run:
    workflows: ["Sync SharpSpring", "Sync Wildix"]
    types:
      - completed
  workflow_dispatch:  # manual trigger

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Test raw MotherDuck connection
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          uv run python -c "
          import duckdb, os
          token = os.environ['MOTHERDUCK_TOKEN']
          print(f'Token length: {len(token)}, starts with: {token[:10]}')
          conn = duckdb.connect(f'md:trust-pipeline?motherduck_token={token}')
          result = conn.execute('SELECT COUNT(*) FROM bronze.sharpspring_leads').fetchone()
          print(f'Raw Python connection SUCCESS. Bronze leads: {result[0]}')
          conn.close()
          "

      - name: Run dbt build
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: ${{ secrets.MOTHERDUCK_DATABASE }}
        run: |
          export motherduck_token=$MOTHERDUCK_TOKEN
          uv run dbt build --project-dir dbt_project --profiles-dir dbt_project

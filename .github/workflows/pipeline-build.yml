name: Pipeline Build

on:
  workflow_run:
    workflows: ["Sync SharpSpring", "Sync Wildix", "Sync Unleashed"]
    types:
      - completed
  schedule:
    - cron: "0 * * * *"  # hourly fallback — picks up Airbyte (Google/Meta/Bing) syncs
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/297734667086/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: trust-pipeline@trustwarehouse.iam.gserviceaccount.com

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Set dbt selector
        id: selector
        run: |
          TRIGGER="${{ github.event.workflow_run.name }}"
          if [ "$TRIGGER" = "Sync SharpSpring" ]; then
            echo "selector=silver_sharpspring_leads silver_sharpspring_campaigns silver_sharpspring_opportunities silver_sharpspring_deal_stages gold_lead_activity gold_campaign_attribution gold_agent_performance_daily gold_pipeline_opportunities" >> $GITHUB_OUTPUT
          elif [ "$TRIGGER" = "Sync Wildix" ]; then
            echo "selector=silver_wildix_calls silver_wildix_colleagues gold_lead_activity gold_agent_performance_daily" >> $GITHUB_OUTPUT
          else
            echo "selector=" >> $GITHUB_OUTPUT
          fi

      - name: Run dbt seed + build
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          uv run dbt seed --project-dir dbt_project --profiles-dir dbt_project --target prod
          SELECTOR="${{ steps.selector.outputs.selector }}"
          if [ -z "$SELECTOR" ]; then
            uv run dbt build --project-dir dbt_project --profiles-dir dbt_project --target prod
          else
            uv run dbt build --project-dir dbt_project --profiles-dir dbt_project --target prod --select $SELECTOR
          fi

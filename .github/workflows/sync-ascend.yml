name: Sync Ascend

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Hours of CDR history to pull (raise for a backfill)"
        required: false
        default: "2"
  # no schedule — primary sync runs on the OCI VM every 60s; this workflow is the
  # manual backup (workflow_dispatch) for VM outages

concurrency:
  group: sync-ascend
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/297734667086/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: trust-pipeline@trustwarehouse.iam.gserviceaccount.com

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run Ascend pipeline
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          ASCEND_CLIENT_ID: ${{ secrets.ASCEND_CLIENT_ID }}
          ASCEND_CLIENT_SECRET: ${{ secrets.ASCEND_CLIENT_SECRET }}
          ASCEND_LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '2' }}
        run: uv run python -m ingestion.ascend

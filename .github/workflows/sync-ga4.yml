name: Sync GA4

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *"  # STOPGAP while the OCI VM is down — 01,04,…,22 London (BST); remove when the VM is back

concurrency:
  group: sync-ga4
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/297734667086/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: trust-pipeline@trustwarehouse.iam.gserviceaccount.com

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run GA4 pipeline
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: uv run python -m ingestion.ga4

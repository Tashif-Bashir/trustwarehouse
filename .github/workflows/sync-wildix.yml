name: Sync Wildix

on:
  schedule:
    - cron: "0 7 * * *"   # twice daily: 7:00am UTC
    - cron: "0 18 * * *"  # twice daily: 6:00pm UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/297734667086/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: trust-pipeline@trustwarehouse.iam.gserviceaccount.com

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run Wildix pipeline
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          WILDIX_API_BASE_URL: ${{ secrets.WILDIX_API_BASE_URL }}
          WILDIX_SIMPLE_TOKEN: ${{ secrets.WILDIX_SIMPLE_TOKEN }}
          WILDIX_WSK_TOKEN: ${{ secrets.WILDIX_WSK_TOKEN }}
        run: uv run python -m ingestion.wildix

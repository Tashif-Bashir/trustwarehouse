<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Users — Trust Availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F2F3F7;--panel:#FFFFFF;--ink:#171A2B;--ink2:#3B3F55;
    --muted:#9AA0B4;--line:#EDEEF3;
    --indigo:#5B6CFF;--indigo-soft:#EEF0FF;
    --rose:#FF6B7A;--rose-soft:#FFE9EC;
    --mint:#3DD0A4;--mint-soft:#E2F8EF;
    --shadow-sm:0 1px 3px rgba(20,23,40,.05);
    --shadow-md:0 8px 24px rgba(20,23,40,.08);
  }
  html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:14px}
  .layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  .sidebar{background:var(--panel);border-right:1px solid var(--line);padding:22px 0}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 18px 24px}
  .logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5B6CFF,#8B5CF6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
  .logo-name{font-weight:700;font-size:15px}
  .nav-link{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:10px;margin:1px 8px;font-size:13.5px;font-weight:500;color:var(--ink2);text-decoration:none}
  .nav-link:hover,.nav-link.active{background:linear-gradient(135deg,#5B6CFF,#8B5CF6);color:#fff}
  .main{padding:26px 28px}
  .page-title{font-size:22px;font-weight:700;letter-spacing:-.4px;margin-bottom:22px}
  .card{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-sm);padding:22px;margin-bottom:20px}
  .card-title{font-size:14px;font-weight:700;margin-bottom:16px}
  table{width:100%;border-collapse:collapse}
  th{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:8px 12px;border-bottom:2px solid var(--line);text-align:left}
  td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
  .badge{display:inline-block;padding:2px 9px;border-radius:5px;font-size:11.5px;font-weight:600}
  .badge-admin{background:var(--indigo-soft);color:var(--indigo)}
  .badge-user{background:var(--mint-soft);color:#1a7a5a}
  .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .form-field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
  .form-field label{font-size:11.5px;font-weight:600;color:var(--muted)}
  input[type=text],input[type=email],input[type=password],select{padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);font-family:inherit;font-size:13.5px;color:var(--ink);outline:none;width:100%}
  input:focus,select:focus{border-color:var(--indigo)}
  .btn{padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none}
  .btn-primary{background:linear-gradient(135deg,#5B6CFF,#8B5CF6);color:#fff}
  .btn-danger{background:var(--rose-soft);color:var(--rose)}
  .btn-sm{padding:5px 11px;font-size:12px;border-radius:7px}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:18px;font-weight:500}
  .back:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">T</div>
      <div class="logo-name">Trust</div>
    </div>
    <a href="/" class="nav-link">Availability</a>
    <a href="/reps" class="nav-link">Rep Diary</a>
    <a href="/admin/users" class="nav-link active">Manage Users</a>
    <a href="/admin/reps" class="nav-link">Manage Reps</a>
    <a href="/logout" class="nav-link" style="margin-top:auto">Sign out</a>
  </aside>
  <main class="main">
    <a href="/" class="back">← Back to Availability</a>
    <div class="page-title">Manage Users</div>

    <div class="card">
      <div class="card-title">Current Users</div>
      <table>
        <thead>
          <tr><th>Username</th><th>Name</th><th>Email</th><th>Role</th><th></th></tr>
        </thead>
        <tbody>
          {% for u in users %}
          <tr>
            <td>{{ u.username }}</td>
            <td>{{ u.name }}</td>
            <td style="color:var(--muted2);font-size:12.5px">{{ u.email or '—' }}</td>
            <td><span class="badge badge-{{ u.role }}">{{ u.role }}</span></td>
            <td>
              <form method="post" action="/admin/users/delete/{{ u.username }}"
                onsubmit="return confirm('Delete {{ u.username }}?')">
                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-title">Add User</div>
      <form method="post" action="/admin/users/add">
        <div class="form-row">
          <div class="form-field">
            <label>Username</label>
            <input type="text" name="username" required placeholder="e.g. lily">
          </div>
          <div class="form-field">
            <label>Full name</label>
            <input type="text" name="name" required placeholder="e.g. Lily Smith">
          </div>
          <div class="form-field">
            <label>Email address</label>
            <input type="email" name="email" placeholder="kelly@trustelectricheating.co.uk">
          </div>
          <div class="form-field" style="max-width:160px">
            <label>Role</label>
            <select name="role">
              <option value="user">user</option>
              <option value="admin">admin</option>
            </select>
          </div>
          <div class="form-field">
            <label>Password</label>
            <input type="password" name="password" required placeholder="temporary password">
          </div>
          <div style="display:flex;align-items:flex-end">
            <button type="submit" class="btn btn-primary">Add user</button>
          </div>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>

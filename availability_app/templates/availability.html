<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Availability — Trust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F2F3F7;--panel:#FFFFFF;--ink:#171A2B;--ink2:#3B3F55;
    --muted:#9AA0B4;--muted2:#C7CADA;--line:#EDEEF3;--line2:#E5E7EF;
    --indigo:#5B6CFF;--indigo-soft:#EEF0FF;
    --violet:#8B5CF6;--violet-soft:#F2EDFF;
    --mint:#3DD0A4;--mint-soft:#E2F8EF;
    --rose:#FF6B7A;--rose-soft:#FFE9EC;
    --amber:#F5B544;--amber-soft:#FFF4DC;
    --shadow-sm:0 1px 3px rgba(20,23,40,.05);
    --shadow-md:0 8px 24px rgba(20,23,40,.08);
    --shadow-lg:0 12px 40px rgba(20,23,40,.10);
  }
  html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}

  /* Layout */
  .layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  .sidebar{background:var(--panel);border-right:1px solid var(--line);padding:22px 0;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 18px 24px}
  .logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5B6CFF,#8B5CF6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;box-shadow:0 5px 12px rgba(91,108,255,.3);flex-shrink:0}
  .logo-name{font-weight:700;font-size:15px;letter-spacing:-.2px}
  .logo-sub{font-size:11px;color:var(--muted);font-weight:500}
  .nav-section{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);padding:6px 18px;font-weight:600;margin-top:8px}
  .nav-link{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:10px;margin:1px 8px;font-size:13.5px;font-weight:500;color:var(--ink2);transition:all .15s;text-decoration:none}
  .nav-link:hover{background:var(--bg);color:var(--ink)}
  .nav-link.active{background:linear-gradient(135deg,#5B6CFF,#8B5CF6);color:#fff;box-shadow:0 6px 18px rgba(91,108,255,.28)}
  .nav-link.active svg{color:#fff!important}
  .nav-link svg{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
  .sidebar-footer{margin-top:auto;padding:16px 18px;border-top:1px solid var(--line)}
  .user-row{display:flex;align-items:center;gap:10px;font-size:13px}
  .user-avatar{width:30px;height:30px;border-radius:8px;background:var(--indigo-soft);color:var(--indigo);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
  .user-photo{width:30px;height:30px;border-radius:8px;object-fit:cover;flex-shrink:0}
  .user-name{font-weight:600;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user-role{font-size:11px;color:var(--muted)}
  .logout-btn{font-size:12px;color:var(--muted);font-weight:500;text-decoration:none;padding:4px 8px;border-radius:6px;margin-left:auto;flex-shrink:0}
  .logout-btn:hover{background:var(--rose-soft);color:var(--rose)}

  /* Main */
  .main{padding:18px 24px 40px;min-width:0;overflow-x:hidden}
  .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:16px;flex-wrap:wrap}
  .page-title{font-size:22px;font-weight:700;letter-spacing:-.4px}
  .header-actions{display:flex;align-items:center;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
  .btn-primary{background:linear-gradient(135deg,#5B6CFF,#8B5CF6);color:#fff;box-shadow:0 4px 14px rgba(91,108,255,.28)}
  .btn-primary:hover{opacity:.9}
  .btn-ghost{background:var(--panel);color:var(--ink2);box-shadow:var(--shadow-sm)}
  .btn-ghost:hover{box-shadow:var(--shadow-md);color:var(--ink)}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}

  /* Search bar */
  .search-bar{background:var(--panel);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .search-field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:160px}
  .search-field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
  .search-input{padding:9px 13px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);font-size:13.5px;color:var(--ink);outline:none;transition:border-color .15s;width:100%}
  .search-input:focus{border-color:var(--indigo)}
  .region-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:var(--indigo-soft);color:var(--indigo)}
  .region-resolved{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px}
  .divider-v{width:1px;background:var(--line);height:40px;flex-shrink:0}

  /* Stats bar */
  .stats-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .stat-chip{background:var(--panel);border-radius:10px;padding:7px 13px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:8px}
  .stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .stat-dot.free{background:var(--mint)}
  .stat-dot.booked{background:var(--muted2)}
  .stat-dot.off{background:var(--rose)}
  .stat-label{font-size:12.5px;font-weight:600;color:var(--ink2)}
  .stat-val{font-size:12.5px;font-weight:700;color:var(--ink)}

  /* View toggle */
  .view-toggle{display:flex;gap:3px;background:var(--bg);border-radius:10px;padding:3px}
  .view-toggle .btn-sm{border-radius:7px;padding:5px 14px}
  /* Date picker — styled as a ghost button */
  input[type=date].date-btn{
    appearance:none;-webkit-appearance:none;
    padding:6px 12px;border-radius:8px;border:none;
    background:var(--panel);color:var(--ink2);
    font-family:inherit;font-size:12px;font-weight:600;
    box-shadow:var(--shadow-sm);cursor:pointer;
    outline:none;
  }
  input[type=date].date-btn::-webkit-calendar-picker-indicator{
    cursor:pointer;opacity:.6;
  }
  .date-active{background:var(--indigo-soft);color:var(--indigo)}

  /* Availability grid */
  .grid-wrap{overflow-x:auto;margin-bottom:16px}
  .avail-table{border-collapse:collapse;width:100%;min-width:700px}
  .avail-table th{background:var(--panel);padding:10px 14px;text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
  .avail-table th:first-child{min-width:170px}
  .avail-table td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .rep-cell{display:flex;flex-direction:column;gap:2px}
  .rep-name{font-size:13px;font-weight:600;color:var(--ink)}
  .rep-region{font-size:11px;color:var(--muted);font-weight:500}
  .rep-fallback{font-size:10.5px;color:var(--amber);font-weight:600;background:var(--amber-soft);padding:1px 6px;border-radius:4px;width:fit-content}
  .rep-freelancer{font-size:10.5px;color:var(--violet);font-weight:600;background:var(--violet-soft);padding:1px 6px;border-radius:4px;width:fit-content}
  /* Week view cells */
  .day-cell{cursor:pointer;border-radius:9px;padding:7px 10px;transition:all .15s;min-width:90px;text-align:center}
  .day-cell:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .day-cell.free{background:var(--mint-soft);color:#1a7a5a}
  .day-cell.partial{background:var(--amber-soft);color:#8a6200}
  .day-cell.full{background:var(--line);color:var(--muted)}
  .day-cell.off{background:var(--rose-soft);color:#c0392b}
  .day-cell.weekend{background:var(--bg);color:var(--muted2);cursor:default;border:1px dashed var(--line2)}
  .day-cell.selected{outline:2px solid var(--indigo);outline-offset:1px}
  .day-count{font-size:16px;font-weight:700}
  .day-label{font-size:10.5px;font-weight:600;margin-top:1px}
  /* Month view — compact cells */
  .day-cell.compact{min-width:44px;padding:6px 4px;border-radius:7px}
  .day-cell.compact .day-count{font-size:13px}
  .day-cell.compact.weekend{border:none;background:var(--bg)}
  .avail-table.month-view th{padding:6px 4px;font-size:10px;letter-spacing:0;text-align:center;line-height:1.3}
  .avail-table.month-view td{padding:4px 3px}
  .avail-table.month-view th:first-child{padding:6px 14px;text-align:left}
  .avail-table.month-view td:first-child{padding:8px 10px}
  .th-month-label{font-size:9px;font-weight:700;color:var(--indigo);letter-spacing:.3px;text-transform:uppercase;line-height:1;margin-bottom:2px}
  .th-day-num{font-size:12px;font-weight:700;line-height:1}
  .th-weekday{font-size:9px;font-weight:600;color:var(--muted);line-height:1;margin-top:1px}
  .row-divider td{padding:4px 0;border-bottom:1px dashed var(--line2)}
  .row-divider-label td{padding:6px 10px 2px;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--amber);background:none;border:none}

  /* Slot drawer */
  .drawer{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-md);padding:20px 22px;margin-bottom:24px;animation:slideDown .2s ease-out}
  @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .drawer-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .drawer-title{font-size:15px;font-weight:700;letter-spacing:-.2px}
  .drawer-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
  .slot{padding:7px 10px;border-radius:8px;text-align:center;font-size:12.5px;font-weight:600;transition:all .15s}
  .slot.free{background:var(--mint-soft);color:#1a7a5a;cursor:pointer}
  .slot.free:hover{background:#bdf2df;transform:translateY(-1px)}
  .slot.buffer{background:var(--amber-soft);color:#92400e;cursor:pointer}
  .slot.buffer:hover{background:#fde68a;transform:translateY(-1px)}
  .slot.booked{background:var(--line);color:var(--muted);cursor:default}
  .slot.off{background:var(--rose-soft);color:#c0392b;cursor:default}
  .slot.past{background:var(--bg);color:var(--muted2);cursor:default;opacity:.6}
  .slot.free.past-slot{background:var(--line);color:var(--muted2);cursor:default}
  .day-cell.past-day{opacity:.6}
  .slot.sel-range{background:#DBEAFE;color:#1D4ED8;outline:1px solid #93C5FD;cursor:pointer}
  .slot.sel-range:hover{background:#BFDBFE}
  .slot.sel-start{background:var(--indigo);color:#fff;box-shadow:0 2px 8px rgba(91,108,255,.4);cursor:pointer}
  .slot.sel-start:hover{background:var(--indigo);opacity:.9}
  .slot.sel-end{background:var(--indigo);color:#fff;box-shadow:0 2px 8px rgba(91,108,255,.4);cursor:pointer}
  .slot.sel-end:hover{background:var(--indigo);opacity:.9}
  .slot-copy{font-size:10px;display:block;margin-top:2px;font-weight:500}
  /* Booking form */
  .booking-form{background:var(--bg);border-radius:12px;padding:16px 18px;margin-top:18px;border:1.5px solid var(--line)}
  .booking-range-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .booking-range-label{font-size:13px;font-weight:600;color:var(--ink)}
  .booking-range-badge{background:var(--indigo-soft);color:var(--indigo);font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px}
  .booking-hint{font-size:12px;color:var(--muted);font-weight:400}
  .booking-fields{display:flex;flex-direction:column;gap:10px}
  .booking-field label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:4px}
  .booking-field input,.booking-field textarea{width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);font-family:inherit;font-size:13px;color:var(--ink);outline:none;transition:border-color .15s}
  .booking-field input:focus,.booking-field textarea:focus{border-color:var(--indigo)}
  .booking-field textarea{resize:vertical;min-height:72px}
  .booking-actions{display:flex;gap:8px;margin-top:14px;align-items:center;justify-content:flex-end}
  .conflict-notice{background:var(--rose-soft);color:#c0392b;font-size:12px;font-weight:600;padding:8px 12px;border-radius:8px;margin-top:10px}
  /* Lead search */
  .lead-search{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
  .lead-search-label{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:8px}
  .lead-search-label span{display:block;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;font-size:11px;margin-top:2px}
  .lead-search-inputs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .lead-search-inputs input{flex:1;min-width:84px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);font-family:inherit;font-size:13px;color:var(--ink);outline:none}
  .lead-search-inputs input:focus{border-color:var(--indigo)}
  .lead-results{margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);max-height:210px;overflow-y:auto}
  .lead-result{padding:8px 11px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;display:flex;flex-direction:column;gap:2px}
  .lead-result:last-child{border-bottom:none}
  .lead-result:hover{background:var(--indigo-soft)}
  .lead-result-meta{font-size:11.5px;color:var(--muted)}
  .lead-selected{margin-top:8px;padding:8px 11px;border-radius:8px;background:var(--mint-soft);color:#1a7a5a;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .lead-unlink{background:none;border:none;color:var(--indigo);font-weight:600;font-size:12px;cursor:pointer;text-decoration:underline;flex-shrink:0}
  .lead-skip{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);cursor:pointer}
  .lead-skip input{width:15px;height:15px;cursor:pointer;accent-color:var(--indigo)}
  .lead-none{margin-top:8px;font-size:12.5px;color:#b45309;font-weight:500}
  .lead-calendar-only{margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:500}
  .appt-type-row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
  .appt-type-field{flex:1;min-width:150px}
  .appt-type-field label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:4px}
  .appt-type-field select{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);font-family:inherit;font-size:13px;color:var(--ink);outline:none;cursor:pointer}
  .appt-type-field select:focus{border-color:var(--indigo)}
  .booked-box{max-width:420px}
  .booked-icon{width:52px;height:52px;border-radius:50%;background:var(--mint-soft);color:#1a7a5a;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  /* App-bookings adoption badge */
  .cal-anchor{position:relative}
  .appb-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;border:none;background:linear-gradient(135deg,#5B6CFF,#8B5CF6);color:#fff;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 5px 14px rgba(91,108,255,.28)}
  .appb-chip:hover{opacity:.92}
  .appb-num{background:rgba(255,255,255,.22);border-radius:6px;padding:1px 8px;font-size:13.5px;font-weight:700}
  .appb-panel{position:absolute;top:calc(100% + 8px);right:0;background:var(--panel);border-radius:14px;box-shadow:var(--shadow-md);border:1px solid var(--line);padding:14px;z-index:250;width:420px;max-height:420px;overflow-y:auto}
  .appb-title{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .appb-empty{font-size:13px;color:var(--muted);padding:8px 0}
  .appb-row{display:flex;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:baseline}
  .appb-row:last-child{border-bottom:none}
  .appb-row.cancelled .appb-what{color:var(--muted);text-decoration:line-through}
  .appb-when{color:var(--muted);font-weight:600;flex-shrink:0;font-variant-numeric:tabular-nums}
  .appb-what{color:var(--ink);line-height:1.45;min-width:0}
  .appb-meta{color:var(--muted)}
  /* Confirm modal */
  .confirm-overlay{position:fixed;inset:0;background:rgba(20,23,40,.45);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .15s ease-out}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .confirm-box{background:var(--panel);border-radius:18px;padding:28px;max-width:400px;width:90%;box-shadow:var(--shadow-lg)}
  .confirm-title{font-size:16px;font-weight:700;letter-spacing:-.2px;margin-bottom:12px}
  .confirm-detail{font-size:13.5px;color:var(--ink2);line-height:1.7;margin-bottom:22px}
  .confirm-actions{display:flex;gap:10px;justify-content:flex-end}
  /* Booking result */
  .booking-result{border-radius:10px;padding:14px 16px;margin-top:16px}
  .booking-result.ok{background:var(--mint-soft);color:#1a7a5a}
  .booking-result.err{background:var(--rose-soft);color:#c0392b}
  .booking-result .result-title{font-size:13px;font-weight:700;margin-bottom:4px}
  .booking-result .result-detail{font-size:12px;opacity:.85}
  /* Teams toggle */
  .toggle-row{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;user-select:none}
  .toggle-pill{width:36px;height:20px;border-radius:20px;background:var(--line2);position:relative;transition:background .2s;flex-shrink:0}
  .toggle-pill.on{background:var(--indigo)}
  .toggle-knob{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
  .toggle-pill.on .toggle-knob{transform:translateX(16px)}
  .toggle-label{font-size:13px;font-weight:500;color:var(--ink2)}

  /* Loading / error */
  .loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:160px;gap:12px;color:var(--muted)}
  .spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--indigo);animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{background:var(--rose-soft);color:#c0392b;border-radius:10px;padding:14px 18px;font-size:13.5px}
  /* Constrain inline SVG icons everywhere outside the nav */
  .main svg{width:16px;height:16px;flex-shrink:0;vertical-align:middle}
  .region-resolved svg{width:13px;height:13px}
  .header-actions svg{width:14px;height:14px}
  .btn svg{width:13px;height:13px}
</style>
</head>

<div id="root"></div>
<script>
const ROLE = {{ role | tojson }};
const USERNAME = {{ username | tojson }};
const USER_EMAIL = {{ user_email | tojson }};
const PHOTO_URL = {{ photo_url | tojson }};
const INITIAL_REGIONS = {{ regions | tojson }};
</script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useCallback } = React;

/* ── Icons ── */
const Ic = {
  calendar: <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7"><rect x="3" y="4" width="14" height="14" rx="3"/><path d="M3 8h14M7 2v4M13 2v4"/></svg>,
  refresh: <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="M4 4a8 8 0 1 1 0 12"/><path d="M4 8V4H0"/></svg>,

  list: <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="M7 5h10M7 10h10M7 15h10M3 5h.01M3 10h.01M3 15h.01"/></svg>,
};

const TODAY_ISO = new Date().toISOString().slice(0, 10);

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtDateShort(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' });
}
function fmtMonthHeader(iso, prevIso) {
  const d = new Date(iso);
  const isNewMonth = !prevIso || new Date(prevIso).getMonth() !== d.getMonth();
  return {
    day: d.getDate(),
    weekday: d.toLocaleDateString('en-GB', { weekday: 'short' }).slice(0, 3),
    monthLabel: isNewMonth ? d.toLocaleDateString('en-GB', { month: 'short' }) : null,
  };
}
function fmtRelativeTime(date) {
  if (!date) return '';
  const secs = Math.floor((Date.now() - date.getTime()) / 1000);
  if (secs < 60) return 'just now';
  if (secs < 3600) return `${Math.floor(secs / 60)} min ago`;
  return `${Math.floor(secs / 3600)}h ago`;
}
function isWeekend(iso) {
  const d = new Date(iso); return d.getDay() === 0 || d.getDay() === 6;
}

/* ── Day cell ── */
function DayCell({ slots, onClick, selected, dayIso, compact, isPast }) {
  const compactCls = compact ? ' compact' : '';
  if (isWeekend(dayIso) && (!slots || slots.length === 0)) {
    return (
      <td>
        <div className={`day-cell weekend${compactCls}`}>
          {!compact && <div className="day-count" style={{fontSize:11}}>Weekend</div>}
        </div>
      </td>
    );
  }
  if (!slots || slots.length === 0) return <td><div className={`day-cell full${compactCls}${isPast ? ' past-day' : ''}`}><div className="day-count">—</div></div></td>;
  const free   = slots.filter(s => s.status === 'free').length;
  const booked = slots.filter(s => s.status === 'booked').length;
  const off    = slots.every(s => s.status === 'off');
  let cls = 'day-cell';
  if (off)                      { cls += ' off'; }
  else if (isPast && booked > 0){ cls += ' partial'; }
  else if (free === 0)          { cls += ' full'; }
  else if (free < 4)            { cls += ' partial'; }
  else                          { cls += ' free'; }
  if (isPast)    cls += ' past-day';
  if (selected)  cls += ' selected';
  if (compact)   cls += ' compact';
  const displayNum   = isPast ? booked : free;
  const displayLabel = isPast
    ? (booked > 0 ? `${booked} booked` : 'none booked')
    : `${free} free${booked ? ` · ${booked} bkd` : ''}`;
  const title = `${free} free · ${booked} booked — click to see slots`;
  return (
    <td>
      <div className={cls} onClick={onClick} title={title}>
        <div className="day-count">{off ? '—' : displayNum}</div>
        {!compact && <div className="day-label">{off ? 'Off' : displayLabel}</div>}
      </div>
    </td>
  );
}

/* ── Slot drawer with booking ── */
function SlotDrawer({ rep, dayIso, slots, onClose, onBooked, dayIsPast }) {
  const [selStart, setSelStart] = useState(null);
  const [selEnd,   setSelEnd]   = useState(null);
  const [custName,     setCustName]     = useState('');
  const [custEmail,    setCustEmail]    = useState('');
  const [postcode,     setPostcode]     = useState('');
  const [location,     setLocation]     = useState('');
  const [ccEmails,     setCcEmails]     = useState(['']);
  const [notes,        setNotes]        = useState('');
  const [teamsEnabled, setTeamsEnabled] = useState(false);
  const [confirming, setConfirming] = useState(false);
  const [booking,    setBooking]    = useState(false);
  const [result,     setResult]     = useState(null);
  // Lead search (links the booking to a SharpSpring lead so the CRM updates)
  const [lsName,     setLsName]     = useState('');
  const [lsPhone,    setLsPhone]    = useState('');
  const [lsEmail,    setLsEmail]    = useState('');
  const [lsPostcode, setLsPostcode] = useState('');
  const [leadResults,   setLeadResults]   = useState([]);
  const [leadSearching, setLeadSearching] = useState(false);
  const [searched,      setSearched]      = useState(false);
  const [leadId,        setLeadId]        = useState('');
  const [leadName,      setLeadName]      = useState('');
  const [skipCrm,       setSkipCrm]       = useState(false);
  // Heating / water appointment type + the telesales call on the other pipeline
  const [apptType,     setApptType]     = useState('heating');
  const [otherOutcome, setOtherOutcome] = useState('');
  // Independent, human-chosen Enquiry Type — written to the CRM as picked
  const [enquiryType,  setEnquiryType]  = useState('');

  function addMins(t, m) {
    const [h, min] = t.split(':').map(Number);
    const tot = h * 60 + min + m;
    return `${String(Math.floor(tot / 60)).padStart(2, '0')}:${String(tot % 60).padStart(2, '0')}`;
  }

  // End slot = end time. No end selected ⇒ a single 30-min appointment (also lets you book the last slot of the day).
  const bookingEnd = selEnd ? selEnd : (selStart ? addMins(selStart, 30) : null);

  function inRange(time) {            // highlight: start..end inclusive (end slot shown as the endpoint)
    if (!selStart) return false;
    return time >= selStart && time <= (selEnd || selStart);
  }

  // Blocks the appointment actually occupies = start .. (bookingEnd − 30). The end slot is a boundary, not occupied.
  const occupiedSlots = slots.filter(s => selStart && bookingEnd && s.time >= selStart && s.time < bookingEnd);
  const hasConflict   = occupiedSlots.some(s => s.status === 'booked' || s.status === 'off' || s.status === 'past');
  const canBook       = !!(selStart && custName.trim() && postcode.trim() && !hasConflict && !result && !dayIsPast);

  function handleSlotClick(slot) {
    if (result || (slot.status !== 'free' && slot.status !== 'buffer') || dayIsPast) return;
    if (!selStart) {
      setSelStart(slot.time); setSelEnd(null);
    } else if (!selEnd) {
      if (slot.time === selStart) { setSelStart(null); }          // deselect
      else if (slot.time > selStart) { setSelEnd(slot.time); }    // set end
      else { setSelStart(slot.time); setSelEnd(null); }            // reset to earlier
    } else {
      setSelStart(slot.time); setSelEnd(null);                     // start new range
    }
  }

  function clearSelection() {
    setSelStart(null); setSelEnd(null);
    setCustName(''); setCustEmail(''); setPostcode(''); setLocation(''); setCcEmails(['']); setNotes(''); setTeamsEnabled(false);
    setLsName(''); setLsPhone(''); setLsEmail(''); setLsPostcode('');
    setLeadResults([]); setSearched(false); setLeadId(''); setLeadName(''); setSkipCrm(false);
    setApptType('heating'); setOtherOutcome(''); setEnquiryType('');
  }

  async function searchLeads() {
    setLeadSearching(true); setSearched(false);
    try {
      const resp = await fetch('/api/search_leads', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: lsName.trim(), phone: lsPhone.trim(),
          email: lsEmail.trim(), postcode: lsPostcode.trim(),
        }),
      });
      const data = await resp.json();
      setLeadResults(data.leads || []);
    } catch (e) {
      setLeadResults([]);
    } finally {
      setLeadSearching(false); setSearched(true);
    }
  }

  function applyEnquiryType(eqRaw) {
    const eq = (eqRaw || '').toLowerCase();
    // Pre-fill both dropdowns; each stays independently editable after.
    setEnquiryType(eq === 'water' ? 'Water' : eq === 'heating and water' ? 'Heating and Water'
                   : eq === 'heating' ? 'Heating' : '');
    setApptType(eq === 'water' ? 'water' : eq === 'heating and water' ? 'both' : 'heating');
  }

  function selectLead(l) {
    setLeadId(l.id); setLeadName(l.name || '(no name)');
    if (l.name)     setCustName(l.name);
    if (l.postcode) setPostcode(l.postcode.toUpperCase());
    if (l.email)    setCustEmail(l.email);
    // Pre-fill from the search result immediately (may be up to ~30 min stale)...
    applyEnquiryType(l.enquiry_type);
    setOtherOutcome('');
    setLeadResults([]); setSearched(false);
    // ...then correct it with the live CRM value (telesales often change the
    // enquiry type during the call and book straight after).
    fetch(`/api/lead_enquiry?id=${encodeURIComponent(l.id)}`)
      .then(r => r.json())
      .then(d => { if (d.enquiry_type) applyEnquiryType(d.enquiry_type); })
      .catch(() => {});
  }

  function unlinkLead() {
    setLeadId(''); setLeadName(''); setLeadResults([]); setSearched(false);
  }

  const hasLeadQuery = !!(lsName.trim() || lsPhone.trim() || lsEmail.trim() || lsPostcode.trim());

  async function handleBook() {
    setBooking(true);
    try {
      const resp = await fetch('/api/book', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          rep: rep.name, date: dayIso,
          start: selStart, end: bookingEnd,
          customer_name: custName.trim(),
          customer_email: custEmail.trim(),
          postcode: postcode.trim().toUpperCase(),
          location: location.trim(),
          cc_emails: ccEmails.map(e => e.trim()).filter(Boolean),
          notes: notes.trim(),
          teams_meeting: teamsEnabled,
          lead_id: leadId,
          skip_crm: skipCrm,
          appt_type: apptType,
          other_outcome: apptType === 'both' ? '' : otherOutcome,
          enquiry_type: enquiryType,
        }),
      });
      const data = await resp.json();
      setResult(data);
    } catch (e) {
      setResult({ ok: false, message: String(e) });
    } finally {
      setBooking(false);
      setConfirming(false);
    }
  }

  return (
    <div className="drawer">
      <div className="drawer-header">
        <div>
          <div className="drawer-title">{rep.name} · {fmtDate(dayIso)}{dayIsPast ? ' · Past' : ''}</div>
          <div className="drawer-sub">{rep.regions?.join(', ')}</div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={onClose}>{Ic.close}</button>
      </div>

      {/* Instruction hint */}
      {!result && !dayIsPast && (
        <div style={{fontSize:12,color: selStart ? 'var(--indigo)' : 'var(--muted)',fontWeight: selStart ? 600 : 400,marginBottom:10}}>
          {!selStart && 'Click the start slot. Click a later slot to set the end time — or just book a single 30-min slot.'}
          {selStart && !selEnd && `${selStart} – ${bookingEnd} (30 min). Click a later slot to extend the end time, or fill in the form to book.`}
          {selStart && selEnd && `${selStart} – ${bookingEnd} selected. Fill in the form below.`}
        </div>
      )}
      {!result && dayIsPast && (
        <div style={{fontSize:12,color:'var(--muted)',marginBottom:10}}>
          Past date — view only. Booked appointments are shown; free slots were unused.
        </div>
      )}

      {/* Slot grid */}
      <div className="slot-grid">
        {slots.map(slot => {
          const isStart  = slot.time === selStart;
          const isEnd    = !!(selEnd && slot.time === selEnd);
          const inSel    = inRange(slot.time);
          const isSelectable = slot.status === 'free' || slot.status === 'buffer';
          let cls = `slot ${slot.status}`;
          if (slot.status === 'free' && dayIsPast) {
            cls = 'slot free past-slot';
          } else if (isSelectable) {
            if (isStart) cls = 'slot sel-start';
            else if (isEnd) cls = 'slot sel-end';
            else if (inSel) cls = 'slot sel-range';
          }
          const labelColor = (isStart || isEnd) ? 'rgba(255,255,255,0.8)' : undefined;
          const label = !isSelectable
            ? (slot.status === 'booked' ? 'booked' : slot.status === 'past' ? '—' : 'off')
            : isStart && !selEnd ? '× cancel'
            : isStart ? 'start'
            : isEnd ? 'end'
            : inSel ? '✓'
            : !selStart ? 'tap'
            : '';
          return (
            <div key={slot.time} className={cls} onClick={() => handleSlotClick(slot)}
              title={slot.status === 'booked' && slot.subject ? slot.subject : undefined}>
              <span style={{display:'block',fontWeight:700}}>{slot.time}</span>
              <span className="slot-copy" style={labelColor ? {color:labelColor} : {}}>{label}</span>
            </div>
          );
        })}
      </div>

      {/* Booking form */}
      {selStart && !result && (
        <div className="booking-form">
          <div className="booking-range-row">
            <span className="booking-range-label">Appointment:</span>
            <span className="booking-range-badge">{fmtDate(dayIso)} · {selStart} – {bookingEnd}</span>
            {postcode && <span className="booking-range-badge" style={{background:'var(--mint-soft)',color:'#1a7a5a'}}>{postcode}</span>}
            {!selEnd && <span className="booking-hint">single 30-min slot — click a later slot to extend</span>}
          </div>
          <div className="booking-fields">
            {/* Find the lead — links the booking to a SharpSpring lead so the CRM auto-updates */}
            <div className="lead-search">
              <label className="lead-search-label">
                Find the lead {Ic.search || ''}
                <span>type name, phone, email or postcode — updates SharpSpring on booking</span>
              </label>
              {!skipCrm && !leadId && (
                <>
                  <div className="lead-search-inputs">
                    <input type="text" placeholder="Name" value={lsName}
                      onChange={e => setLsName(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && hasLeadQuery && searchLeads()} />
                    <input type="text" placeholder="Phone" value={lsPhone}
                      onChange={e => setLsPhone(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && hasLeadQuery && searchLeads()} />
                    <input type="text" placeholder="Email" value={lsEmail}
                      onChange={e => setLsEmail(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && hasLeadQuery && searchLeads()} />
                    <input type="text" placeholder="Postcode" value={lsPostcode}
                      onChange={e => setLsPostcode(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && hasLeadQuery && searchLeads()} />
                    <button type="button" className="btn btn-primary btn-sm"
                      disabled={!hasLeadQuery || leadSearching} onClick={searchLeads}>
                      {leadSearching ? '…' : 'Search'}
                    </button>
                  </div>
                  {leadResults.length > 0 && (
                    <div className="lead-results">
                      {leadResults.map(l => (
                        <div key={l.id} className="lead-result" onClick={() => selectLead(l)}>
                          <strong>{l.name || '(no name)'}</strong>
                          <span className="lead-result-meta">
                            {[l.postcode, l.phone, l.status].filter(Boolean).join(' · ')}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                  {searched && leadResults.length === 0 && (
                    <div className="lead-none">No lead found — tick "calendar only" below to book without updating SharpSpring.</div>
                  )}
                </>
              )}
              {!skipCrm && leadId && (
                <>
                  <div className="lead-selected">
                    <span>✓ Linked to <strong>{leadName}</strong> — SharpSpring will be updated</span>
                    <button type="button" className="lead-unlink" onClick={unlinkLead}>change</button>
                  </div>
                  <div className="appt-type-row">
                    <div className="appt-type-field">
                      <label>Enquiry type</label>
                      <select value={enquiryType} onChange={e => setEnquiryType(e.target.value)}>
                        <option value="">— leave as is —</option>
                        <option value="Heating">Heating</option>
                        <option value="Water">Water</option>
                        <option value="Heating and Water">Heating and Water</option>
                      </select>
                    </div>
                    <div className="appt-type-field">
                      <label>Appointment for</label>
                      <select value={apptType} onChange={e => setApptType(e.target.value)}>
                        <option value="heating">Heating</option>
                        <option value="water">Water</option>
                        <option value="both">Heating + Water</option>
                      </select>
                    </div>
                    {apptType !== 'both' && (
                      <div className="appt-type-field">
                        <label>{apptType === 'water' ? 'Heating enquiry' : 'Water enquiry'}</label>
                        <select value={otherOutcome} onChange={e => setOtherOutcome(e.target.value)}>
                          <option value="">Leave unchanged</option>
                          <option value="Follow Up">Follow Up</option>
                          <option value="Not Interested">Not Interested</option>
                        </select>
                      </div>
                    )}
                  </div>
                </>
              )}
              {skipCrm && (
                <div className="lead-calendar-only">Calendar only — SharpSpring will not be updated.</div>
              )}
              <label className="lead-skip">
                <input type="checkbox" checked={skipCrm} onChange={e => setSkipCrm(e.target.checked)} />
                Book calendar only — don't update SharpSpring
              </label>
            </div>
            {/* Row 1: name + postcode side by side */}
            <div style={{display:'flex',gap:10}}>
              <div className="booking-field" style={{flex:2}}>
                <label>Customer name *</label>
                <input type="text" placeholder="e.g. Susan Barber" value={custName} onChange={e => setCustName(e.target.value)} />
              </div>
              <div className="booking-field" style={{flex:1}}>
                <label>Postcode *</label>
                <input type="text" placeholder="YO16 6XY" value={postcode}
                  onChange={e => setPostcode(e.target.value.toUpperCase())}
                  style={{textTransform:'uppercase',letterSpacing:'.5px'}} />
              </div>
            </div>
            {/* Location → calendar event Location + CRM address */}
            <div className="booking-field">
              <label>Location / address (optional)</label>
              <input type="text" placeholder="e.g. 7 Alder Close, Sandford, Wareham"
                value={location} onChange={e => setLocation(e.target.value)} />
            </div>
            {/* Customer email */}
            <div className="booking-field">
              <label>Customer email (optional)</label>
              <input type="email" placeholder="customer@email.com" value={custEmail} onChange={e => setCustEmail(e.target.value)} />
            </div>
            {/* CC — multiple */}
            <div className="booking-field">
              <label>CC (optional) — add as many as needed</label>
              {ccEmails.map((addr, i) => (
                <div key={i} style={{display:'flex',gap:6,marginBottom:6}}>
                  <input
                    type="email"
                    placeholder="e.g. chrisk@trustelectricheating.co.uk"
                    value={addr}
                    onChange={e => {
                      const next = [...ccEmails];
                      next[i] = e.target.value;
                      setCcEmails(next);
                    }}
                    style={{flex:1}}
                  />
                  {ccEmails.length > 1 && (
                    <button type="button" onClick={() => setCcEmails(ccEmails.filter((_, j) => j !== i))}
                      style={{padding:'0 10px',borderRadius:8,border:'1.5px solid var(--line)',background:'var(--rose-soft)',color:'var(--rose)',fontWeight:700,cursor:'pointer',flexShrink:0}}>
                      ×
                    </button>
                  )}
                </div>
              ))}
              <button type="button" onClick={() => setCcEmails([...ccEmails, ''])}
                style={{fontSize:12,color:'var(--indigo)',fontWeight:600,background:'none',border:'none',cursor:'pointer',padding:'2px 0'}}>
                + Add CC
              </button>
              {USER_EMAIL
                ? <div style={{fontSize:11,color:'var(--muted)',marginTop:4}}>
                    Your email ({USER_EMAIL}) will be added automatically as a required attendee.
                  </div>
                : <div style={{fontSize:11,color:'var(--amber)',marginTop:4}}>
                    Log in with a personal account to be auto-added to the invite.
                  </div>
              }
            </div>
            {/* Notes → body */}
            <div className="booking-field">
              <label>Notes (goes in body)</label>
              <textarea
                placeholder="Customer details, property info, heating notes…"
                value={notes} onChange={e => setNotes(e.target.value)} rows={3} />
            </div>
            {/* Teams toggle */}
            <div className="toggle-row" onClick={() => setTeamsEnabled(t => !t)}>
              <div className={`toggle-pill${teamsEnabled ? ' on' : ''}`}><div className="toggle-knob"/></div>
              <span className="toggle-label">Add Teams meeting link</span>
            </div>
          </div>
          {hasConflict && (
            <div className="conflict-notice">⚠ Range includes a booked or off slot — adjust end time.</div>
          )}
          <div className="booking-actions">
            <button className="btn btn-ghost btn-sm" onClick={clearSelection}>Clear</button>
            <button className="btn btn-primary" disabled={!canBook} onClick={() => setConfirming(true)}>
              {Ic.calendar} Book Appointment
            </button>
          </div>
        </div>
      )}

      {/* Error stays inline so the form can be retried */}
      {result && !result.ok && (
        <div className="booking-result err">
          <div className="result-title">✗ Error</div>
          <div className="result-detail">{result.message}</div>
          <button className="btn btn-ghost btn-sm" style={{marginTop:10}} onClick={() => setResult(null)}>
            Try again
          </button>
        </div>
      )}

      {/* Success popup — OK closes the drawer and refreshes the grid */}
      {result && result.ok && (
        <div className="confirm-overlay">
          <div className="confirm-box booked-box">
            <div className="booked-icon">✓</div>
            <div className="confirm-title" style={{textAlign:'center'}}>Appointment booked</div>
            <div className="confirm-detail" style={{textAlign:'center'}}>{result.message}</div>
            <div className="confirm-actions" style={{justifyContent:'center'}}>
              <button className="btn btn-primary" style={{minWidth:120}} onClick={onBooked}>OK</button>
            </div>
          </div>
        </div>
      )}

      {/* Confirm modal */}
      {confirming && (
        <div className="confirm-overlay" onClick={e => e.target === e.currentTarget && setConfirming(false)}>
          <div className="confirm-box">
            <div className="confirm-title">Confirm booking</div>
            <div className="confirm-detail">
              <strong>{postcode} — {custName}</strong><br/>
              {rep.name} · {fmtDate(dayIso)} · <strong>{selStart} – {bookingEnd}</strong>
              {ccEmails.some(e => e.trim()) && <><br/>CC: {ccEmails.filter(e => e.trim()).join(', ')}</>}
              {custEmail && <><br/>Customer: {custEmail}</>}
              {teamsEnabled && <><br/>📹 Teams link will be added</>}
              <br/>
              {leadId && !skipCrm
                ? <span style={{color:'#1a7a5a',fontWeight:600}}>
                    ✓ SharpSpring "{leadName}":{' '}
                    {apptType === 'both' && 'Heating = Appointment · Water = Appointment'}
                    {apptType === 'heating' && `Heating = Appointment${otherOutcome ? ` · Water = ${otherOutcome}` : ''}`}
                    {apptType === 'water' && `Water = Appointment${otherOutcome ? ` · Heating = ${otherOutcome}` : ''}`}
                    {enquiryType && ` · Enquiry = ${enquiryType}`}
                  </span>
                : <span style={{color:'var(--muted)'}}>SharpSpring will not be updated (calendar only)</span>}
              {notes && <><br/><span style={{fontSize:12,color:'var(--muted)'}}>{notes}</span></>}
            </div>
            <div className="confirm-actions">
              <button className="btn btn-ghost" onClick={() => setConfirming(false)} disabled={booking}>Cancel</button>
              <button className="btn btn-primary" onClick={handleBook} disabled={booking}>
                {booking ? 'Submitting…' : 'Confirm'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const DAYS_FOR_VIEW = { week: 7, month: 35 };

/* ── Main App ── */
function App() {
  const [location, setLocation] = useState('');
  const [resolvedRegion, setResolvedRegion] = useState(null);
  const [manualRegion, setManualRegion] = useState('');
  const [view, setView] = useState('week'); // 'week' | 'month'
  const [startDate, setStartDate] = useState(''); // '' = today, ISO string = custom
  const [grid, setGrid] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [selected, setSelected] = useState(null); // {repName, day}
  const [lastRefresh, setLastRefresh] = useState(null);
  // Tool-adoption badge: how many appointments were booked via the app
  const [appBookings, setAppBookings] = useState(null);
  const [showBookings, setShowBookings] = useState(false);
  const bookingsRef = useRef(null);
  const [tick, setTick] = useState(0);
  useEffect(() => { const id = setInterval(() => setTick(t => t+1), 30000); return () => clearInterval(id); }, []);
  const resolveTimer = useRef(null);

  const activeRegion = manualRegion || resolvedRegion || null;

  // App-bookings badge: load on start, refresh every 2 minutes
  useEffect(() => {
    function loadAppBookings() {
      fetch('/api/bookings/recent')
        .then(r => r.json())
        .then(d => setAppBookings(d))
        .catch(() => {});
    }
    loadAppBookings();
    const id = setInterval(loadAppBookings, 120000);
    return () => clearInterval(id);
  }, []);

  // close the bookings panel on outside click
  useEffect(() => {
    if (!showBookings) return;
    function handler(e) {
      if (bookingsRef.current && !bookingsRef.current.contains(e.target)) setShowBookings(false);
    }
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [showBookings]);

  // resolve postcode/city as user types
  useEffect(() => {
    clearTimeout(resolveTimer.current);
    if (!location.trim()) { setResolvedRegion(null); return; }
    resolveTimer.current = setTimeout(() => {
      fetch(`/api/resolve-location?q=${encodeURIComponent(location)}`)
        .then(r => r.json())
        .then(d => { setResolvedRegion(d.region || null); setManualRegion(''); })
        .catch(() => {});
    }, 400);
  }, [location]);

  function buildUrl(region, v, sd) {
    let url = `/api/availability?region=${encodeURIComponent(region)}&days=${DAYS_FOR_VIEW[v]}`;
    if (sd) url += `&start_date=${sd}`;
    return url;
  }

  // fetch grid whenever region, view, or startDate changes
  useEffect(() => {
    if (!activeRegion) { setGrid(null); return; }
    setLoading(true); setError(null);
    setSelected(null);
    fetch(buildUrl(activeRegion, view, startDate))
      .then(r => r.json())
      .then(d => {
        if (d.error) throw new Error(d.error);
        setGrid(d);
        setLastRefresh(new Date());
      })
      .catch(e => setError(e.message))
      .finally(() => setLoading(false));
  }, [activeRegion, view, startDate]);

  function handleRefresh() {
    fetch('/api/availability/refresh').then(() => {
      if (activeRegion) setLoading(true);
      fetch(buildUrl(activeRegion, view, startDate))
        .then(r => r.json())
        .then(d => { setGrid(d); setLastRefresh(new Date()); })
        .finally(() => setLoading(false));
    });
  }

  function stepDays(n) {
    const base = startDate || TODAY_ISO;
    const d = new Date(base + 'T00:00:00');
    d.setDate(d.getDate() + n);
    const iso = d.toISOString().slice(0, 10);
    setStartDate(iso === TODAY_ISO ? '' : iso);
    setSelected(null);
  }

  const dates = grid?.dates || [];
  const reps = grid?.reps || [];
  const regionalReps = reps.filter(r => !r.is_fallback);
  const fallbackReps = reps.filter(r => r.is_fallback);

  // calculate stats
  const totalFree = regionalReps.reduce((acc, r) =>
    acc + (dates[0] ? (r.days?.[dates[0]] || []).filter(s => s.status === 'free').length : 0), 0);
  const totalBooked = regionalReps.reduce((acc, r) =>
    acc + (dates[0] ? (r.days?.[dates[0]] || []).filter(s => s.status === 'booked').length : 0), 0);

  const selectedRep = selected ? reps.find(r => r.name === selected.repName) : null;
  const selectedSlots = selected && selectedRep ? (selectedRep.days?.[selected.day] || []) : [];

  return (
    <div className="layout">
      <Sidebar />
      <main className="main">
        <div className="page-header">
          <div>
            <div className="page-title">Who's Free</div>
            {lastRefresh && (
              <div style={{fontSize:12,color:'var(--muted)',marginTop:3}}>
                Updated {fmtRelativeTime(lastRefresh)}
              </div>
            )}
          </div>
          <div className="header-actions">
            {/* Tool-adoption badge: bookings made through this app */}
            <div className="cal-anchor" ref={bookingsRef}>
              <button className="appb-chip" onClick={() => setShowBookings(o => !o)}
                title="Appointments booked through this app">
                <span className="appb-num">{appBookings ? appBookings.today : '–'}</span>
                <span>booked via app today</span>
              </button>
              {showBookings && (
                <div className="appb-panel">
                  <div className="appb-title">Booked through the app — last 7 days</div>
                  {(!appBookings || appBookings.bookings.length === 0) && (
                    <div className="appb-empty">Nothing booked through the app yet.</div>
                  )}
                  {appBookings && appBookings.bookings.map((b, i) => (
                    <div key={i} className={`appb-row${b.status === 'cancelled' ? ' cancelled' : ''}`}>
                      <div className="appb-when">{b.booked_day.slice(5)} · {b.booked_time}</div>
                      <div className="appb-what">
                        <strong>{b.booker_name || '?'}</strong> booked {b.customer} ({b.postcode})
                        <span className="appb-meta"> → {b.rep_name} · {b.appt_date} {b.appt_start}
                          {b.appt_type && b.appt_type !== 'heating' ? ` · ${b.appt_type}` : ''}
                          {b.status === 'cancelled' ? ' · CANCELLED' : ''}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div className="view-toggle">
              <button
                className={`btn btn-sm ${view === 'week' ? 'btn-primary' : 'btn-ghost'}`}
                onClick={() => setView('week')}>
                Week
              </button>
              <button
                className={`btn btn-sm ${view === 'month' ? 'btn-primary' : 'btn-ghost'}`}
                onClick={() => setView('month')}>
                Month
              </button>
            </div>
            <button className="btn btn-ghost btn-sm" onClick={() => stepDays(-7)} title="Previous week">←</button>
            <input
              type="date"
              className={`date-btn${startDate ? ' date-active' : ''}`}
              value={startDate}
              title="Jump to a specific start date"
              onChange={e => { setStartDate(e.target.value); setSelected(null); }}
            />
            <button className="btn btn-ghost btn-sm" onClick={() => stepDays(7)} title="Next week">→</button>
            {startDate && (
              <button className="btn btn-ghost btn-sm" onClick={() => setStartDate('')} title="Back to today">
                × Today
              </button>
            )}
            <button className="btn btn-ghost" onClick={handleRefresh} disabled={loading}>
              {Ic.refresh} Refresh
            </button>
          </div>
        </div>

        {/* Search bar */}
        <div className="search-bar">
          <div className="search-field" style={{flex:2,minWidth:200}}>
            <label>Customer postcode or city</label>
            <input
              className="search-input"
              placeholder="e.g. LS1, Sheffield, Manchester..."
              value={location}
              onChange={e => setLocation(e.target.value)}
            />
            {resolvedRegion && !manualRegion && (
              <div className="region-resolved">
                {Ic.locate} Matched: <strong>{resolvedRegion}</strong>
              </div>
            )}
          </div>
          <div className="divider-v"/>
          <div className="search-field" style={{flex:1.5}}>
            <label>Region</label>
            <select
              className="search-input"
              value={manualRegion || activeRegion || ''}
              onChange={e => { setManualRegion(e.target.value); setLocation(''); setResolvedRegion(null); }}>
              <option value="">— select region —</option>
              {INITIAL_REGIONS.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
          </div>
          {activeRegion && (
            <div style={{display:'flex',alignItems:'flex-end',paddingBottom:1}}>
              <span className="region-badge">{activeRegion}</span>
            </div>
          )}
        </div>

        {!activeRegion && !loading && (
          <div style={{textAlign:'center',color:'var(--muted)',padding:'60px 0',fontSize:14}}>
            Enter a postcode, city, or select a region to see availability.
          </div>
        )}

        {loading && (
          <div className="loader">
            <div className="spinner"/>
            <span>Loading calendar…</span>
          </div>
        )}
        {error && <div className="err">Error: {error}</div>}

        {!loading && !error && grid && (
          <>
            {/* Stats */}
            <div className="stats-bar">
              {!startDate && (
                <>
                  <div className="stat-chip">
                    <div className="stat-dot free"/>
                    <div className="stat-label">Free slots today</div>
                    <div className="stat-val">{totalFree}</div>
                  </div>
                  <div className="stat-chip">
                    <div className="stat-dot booked"/>
                    <div className="stat-label">Booked today</div>
                    <div className="stat-val">{totalBooked}</div>
                  </div>
                </>
              )}
              {startDate && (
                <div className="stat-chip">
                  <div className="stat-dot" style={{background:'var(--indigo)'}}/>
                  <div className="stat-label">Showing from</div>
                  <div className="stat-val">{fmtDate(startDate)}</div>
                </div>
              )}
              <div className="stat-chip">
                <div className="stat-dot" style={{background:'var(--indigo)'}}/>
                <div className="stat-label">Reps in region</div>
                <div className="stat-val">{regionalReps.length}</div>
              </div>
            </div>

            {/* Slot drawer (shown when a cell is clicked) */}
            {selected && selectedRep && (
              <SlotDrawer
                rep={selectedRep}
                dayIso={selected.day}
                slots={selectedSlots}
                dayIsPast={selected.day < TODAY_ISO}
                onClose={() => setSelected(null)}
                onBooked={() => { setSelected(null); handleRefresh(); }}
              />
            )}

            <div className="grid-wrap">
              <table className={`avail-table${view === 'month' ? ' month-view' : ''}`}>
                <thead>
                  <tr>
                    <th>Rep</th>
                    {view === 'week'
                      ? dates.map(d => (
                          <th key={d} style={d === TODAY_ISO ? {
                            background:'var(--indigo-soft)',color:'var(--indigo)',
                            borderRadius:'6px',fontWeight:700
                          } : {}}>
                            {d === TODAY_ISO ? '▸ ' : ''}{fmtDateShort(d)}
                          </th>
                        ))
                      : dates.map((d, i) => {
                          const { day, weekday, monthLabel } = fmtMonthHeader(d, dates[i - 1]);
                          const isToday = d === TODAY_ISO;
                          return (
                            <th key={d} style={isToday ? {
                              background:'var(--indigo-soft)',color:'var(--indigo)',borderRadius:'6px'
                            } : {}}>
                              {monthLabel && <div className="th-month-label">{monthLabel}</div>}
                              <div className="th-day-num" style={isToday ? {color:'var(--indigo)'} : {}}>{isToday ? '▸ ' : ''}{day}</div>
                              <div className="th-weekday">{weekday}</div>
                            </th>
                          );
                        })
                    }
                  </tr>
                </thead>
                <tbody>
                  {regionalReps.map(rep => (
                    <tr key={rep.name}>
                      <td>
                        <div className="rep-cell">
                          <div className="rep-name">{rep.name}</div>
                          <div className="rep-region">{rep.regions?.join(', ')}</div>
                          {rep.is_freelancer && <div className="rep-freelancer">Freelancer / Ambivo</div>}
                          {view === 'week' && rep.today_count > 0 && (
                            <div style={{fontSize:11,color:'var(--muted)',marginTop:1}}>
                              {rep.today_count} booked today
                            </div>
                          )}
                        </div>
                      </td>
                      {dates.map(d => (
                        <DayCell
                          key={d}
                          dayIso={d}
                          isPast={d < TODAY_ISO}
                          compact={view === 'month'}
                          slots={rep.days?.[d]}
                          selected={selected?.repName === rep.name && selected?.day === d}
                          onClick={() => setSelected(
                            selected?.repName === rep.name && selected?.day === d
                              ? null : { repName: rep.name, day: d }
                          )}
                        />
                      ))}
                    </tr>
                  ))}

                  {/* Fallback reps section */}
                  {fallbackReps.length > 0 && (
                    <>
                      <tr className="row-divider"><td colSpan={dates.length + 1}/></tr>
                      <tr className="row-divider-label">
                        <td colSpan={dates.length + 1}>No regional rep — escalation options</td>
                      </tr>
                      {fallbackReps.map(rep => (
                        <tr key={rep.name}>
                          <td>
                            <div className="rep-cell">
                              <div className="rep-name">{rep.name}</div>
                              <div className="rep-fallback">Flexible coverage</div>
                            </div>
                          </td>
                          {dates.map(d => (
                            <DayCell
                              key={d}
                              dayIso={d}
                              isPast={d < TODAY_ISO}
                              compact={view === 'month'}
                              slots={rep.days?.[d]}
                              selected={selected?.repName === rep.name && selected?.day === d}
                              onClick={() => setSelected(
                                selected?.repName === rep.name && selected?.day === d
                                  ? null : { repName: rep.name, day: d }
                              )}
                            />
                          ))}
                        </tr>
                      ))}
                    </>
                  )}
                </tbody>
              </table>
            </div>
          </>
        )}

      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
{% endraw %}
</body>
</html>

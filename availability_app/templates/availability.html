<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Availability — Trust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F2F3F7;--panel:#FFFFFF;--ink:#171A2B;--ink2:#3B3F55;
    --muted:#9AA0B4;--muted2:#C7CADA;--line:#EDEEF3;--line2:#E5E7EF;
    --indigo:#5B6CFF;--indigo-soft:#EEF0FF;
    --violet:#8B5CF6;--violet-soft:#F2EDFF;
    --mint:#3DD0A4;--mint-soft:#E2F8EF;
    --rose:#FF6B7A;--rose-soft:#FFE9EC;
    --amber:#F5B544;--amber-soft:#FFF4DC;
    --shadow-sm:0 1px 3px rgba(20,23,40,.05);
    --shadow-md:0 8px 24px rgba(20,23,40,.08);
    --shadow-lg:0 12px 40px rgba(20,23,40,.10);
  }
  html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}

  /* Layout */
  .layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  .sidebar{background:var(--panel);border-right:1px solid var(--line);padding:22px 0;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 18px 24px}
  .logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5B6CFF,#8B5CF6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;box-shadow:0 5px 12px rgba(91,108,255,.3);flex-shrink:0}
  .logo-name{font-weight:700;font-size:15px;letter-spacing:-.2px}
  .logo-sub{font-size:11px;color:var(--muted);font-weight:500}
  .nav-section{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);padding:6px 18px;font-weight:600;margin-top:8px}
  .nav-link{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:10px;margin:1px 8px;font-size:13.5px;font-weight:500;color:var(--ink2);transition:all .15s;text-decoration:none}
  .nav-link:hover{background:var(--bg);color:var(--ink)}
  .nav-link.active{background:linear-gradient(135deg,#5B6CFF,#8B5CF6);color:#fff;box-shadow:0 6px 18px rgba(91,108,255,.28)}
  .nav-link.active svg{color:#fff!important}
  .nav-link svg{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
  .sidebar-footer{margin-top:auto;padding:16px 18px;border-top:1px solid var(--line)}
  .user-row{display:flex;align-items:center;gap:10px;font-size:13px}
  .user-avatar{width:30px;height:30px;border-radius:8px;background:var(--indigo-soft);color:var(--indigo);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
  .user-name{font-weight:600;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user-role{font-size:11px;color:var(--muted)}
  .logout-btn{font-size:12px;color:var(--muted);font-weight:500;text-decoration:none;padding:4px 8px;border-radius:6px;margin-left:auto;flex-shrink:0}
  .logout-btn:hover{background:var(--rose-soft);color:var(--rose)}

  /* Main */
  .main{padding:18px 24px 40px;min-width:0;overflow-x:hidden}
  .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:16px;flex-wrap:wrap}
  .page-title{font-size:22px;font-weight:700;letter-spacing:-.4px}
  .header-actions{display:flex;align-items:center;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
  .btn-primary{background:linear-gradient(135deg,#5B6CFF,#8B5CF6);color:#fff;box-shadow:0 4px 14px rgba(91,108,255,.28)}
  .btn-primary:hover{opacity:.9}
  .btn-ghost{background:var(--panel);color:var(--ink2);box-shadow:var(--shadow-sm)}
  .btn-ghost:hover{box-shadow:var(--shadow-md);color:var(--ink)}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}

  /* Search bar */
  .search-bar{background:var(--panel);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .search-field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:160px}
  .search-field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
  .search-input{padding:9px 13px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);font-size:13.5px;color:var(--ink);outline:none;transition:border-color .15s;width:100%}
  .search-input:focus{border-color:var(--indigo)}
  .region-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:var(--indigo-soft);color:var(--indigo)}
  .region-resolved{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px}
  .divider-v{width:1px;background:var(--line);height:40px;flex-shrink:0}

  /* Stats bar */
  .stats-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .stat-chip{background:var(--panel);border-radius:10px;padding:7px 13px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:8px}
  .stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .stat-dot.free{background:var(--mint)}
  .stat-dot.booked{background:var(--muted2)}
  .stat-dot.off{background:var(--rose)}
  .stat-label{font-size:12.5px;font-weight:600;color:var(--ink2)}
  .stat-val{font-size:12.5px;font-weight:700;color:var(--ink)}

  /* View toggle */
  .view-toggle{display:flex;gap:3px;background:var(--bg);border-radius:10px;padding:3px}
  .view-toggle .btn-sm{border-radius:7px;padding:5px 14px}
  /* Date picker — styled as a ghost button */
  input[type=date].date-btn{
    appearance:none;-webkit-appearance:none;
    padding:6px 12px;border-radius:8px;border:none;
    background:var(--panel);color:var(--ink2);
    font-family:inherit;font-size:12px;font-weight:600;
    box-shadow:var(--shadow-sm);cursor:pointer;
    outline:none;
  }
  input[type=date].date-btn::-webkit-calendar-picker-indicator{
    cursor:pointer;opacity:.6;
  }
  .date-active{background:var(--indigo-soft);color:var(--indigo)}

  /* Availability grid */
  .grid-wrap{overflow-x:auto;margin-bottom:16px}
  .avail-table{border-collapse:collapse;width:100%;min-width:700px}
  .avail-table th{background:var(--panel);padding:10px 14px;text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
  .avail-table th:first-child{min-width:170px}
  .avail-table td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .rep-cell{display:flex;flex-direction:column;gap:2px}
  .rep-name{font-size:13px;font-weight:600;color:var(--ink)}
  .rep-region{font-size:11px;color:var(--muted);font-weight:500}
  .rep-fallback{font-size:10.5px;color:var(--amber);font-weight:600;background:var(--amber-soft);padding:1px 6px;border-radius:4px;width:fit-content}
  .rep-freelancer{font-size:10.5px;color:var(--violet);font-weight:600;background:var(--violet-soft);padding:1px 6px;border-radius:4px;width:fit-content}
  /* Week view cells */
  .day-cell{cursor:pointer;border-radius:9px;padding:7px 10px;transition:all .15s;min-width:90px;text-align:center}
  .day-cell:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .day-cell.free{background:var(--mint-soft);color:#1a7a5a}
  .day-cell.partial{background:var(--amber-soft);color:#8a6200}
  .day-cell.full{background:var(--line);color:var(--muted)}
  .day-cell.off{background:var(--rose-soft);color:#c0392b}
  .day-cell.weekend{background:var(--bg);color:var(--muted2);cursor:default;border:1px dashed var(--line2)}
  .day-cell.selected{outline:2px solid var(--indigo);outline-offset:1px}
  .day-count{font-size:16px;font-weight:700}
  .day-label{font-size:10.5px;font-weight:600;margin-top:1px}
  /* Month view — compact cells */
  .day-cell.compact{min-width:44px;padding:6px 4px;border-radius:7px}
  .day-cell.compact .day-count{font-size:13px}
  .day-cell.compact.weekend{border:none;background:var(--bg)}
  .avail-table.month-view th{padding:6px 4px;font-size:10px;letter-spacing:0;text-align:center;line-height:1.3}
  .avail-table.month-view td{padding:4px 3px}
  .avail-table.month-view th:first-child{padding:6px 14px;text-align:left}
  .avail-table.month-view td:first-child{padding:8px 10px}
  .th-month-label{font-size:9px;font-weight:700;color:var(--indigo);letter-spacing:.3px;text-transform:uppercase;line-height:1;margin-bottom:2px}
  .th-day-num{font-size:12px;font-weight:700;line-height:1}
  .th-weekday{font-size:9px;font-weight:600;color:var(--muted);line-height:1;margin-top:1px}
  .row-divider td{padding:4px 0;border-bottom:1px dashed var(--line2)}
  .row-divider-label td{padding:6px 10px 2px;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--amber);background:none;border:none}

  /* Slot drawer */
  .drawer{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-md);padding:20px 22px;margin-bottom:24px;animation:slideDown .2s ease-out}
  @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .drawer-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .drawer-title{font-size:15px;font-weight:700;letter-spacing:-.2px}
  .drawer-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
  .slot{padding:7px 10px;border-radius:8px;text-align:center;font-size:12.5px;font-weight:600;transition:all .15s}
  .slot.free{background:var(--mint-soft);color:#1a7a5a;cursor:pointer}
  .slot.free:hover{background:#bdf2df;transform:translateY(-1px)}
  .slot.booked{background:var(--line);color:var(--muted);cursor:default}
  .slot.off{background:var(--rose-soft);color:#c0392b;cursor:default}
  .slot-copy{font-size:10px;display:block;margin-top:2px;color:#27ae60;font-weight:500}
  .copied-toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#171A2B;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:999;animation:toast .15s ease-out}
  @keyframes toast{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

  /* Loading / error */
  .loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:160px;gap:12px;color:var(--muted)}
  .spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--indigo);animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{background:var(--rose-soft);color:#c0392b;border-radius:10px;padding:14px 18px;font-size:13.5px}
  /* Constrain inline SVG icons everywhere outside the nav */
  .main svg{width:16px;height:16px;flex-shrink:0;vertical-align:middle}
  .region-resolved svg{width:13px;height:13px}
  .header-actions svg{width:14px;height:14px}
  .btn svg{width:13px;height:13px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const ROLE = {{ role | tojson }};
const USERNAME = {{ username | tojson }};
const INITIAL_REGIONS = {{ regions | tojson }};
</script>
{% raw %}
<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useCallback } = React;

/* ── Icons ── */
const Ic = {
  calendar: <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7"><rect x="3" y="4" width="14" height="14" rx="3"/><path d="M3 8h14M7 2v4M13 2v4"/></svg>,
  refresh: <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="M4 4a8 8 0 1 1 0 12"/><path d="M4 8V4H0"/></svg>,
  user: <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7"><circle cx="10" cy="7" r="3.5"/><path d="M3 17c0-3.3 3.1-6 7-6s7 2.7 7 6"/></svg>,
  copy: <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7"><rect x="7" y="7" width="10" height="11" rx="2"/><path d="M3 13V4a1 1 0 0 1 1-1h9"/></svg>,
  close: <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 5l10 10M15 5L5 15"/></svg>,
  locate: <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7"><circle cx="10" cy="9" r="3"/><path d="M10 2v2M10 15v3M17 9h2M1 9h2M15.6 4.4l-1.4 1.4M5.8 14.2l-1.4 1.4M15.6 13.6l-1.4-1.4M5.8 5.8L4.4 4.4"/></svg>,
};

const TODAY_ISO = new Date().toISOString().slice(0, 10);

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtDateShort(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' });
}
function fmtMonthHeader(iso, prevIso) {
  const d = new Date(iso);
  const isNewMonth = !prevIso || new Date(prevIso).getMonth() !== d.getMonth();
  return {
    day: d.getDate(),
    weekday: d.toLocaleDateString('en-GB', { weekday: 'short' }).slice(0, 3),
    monthLabel: isNewMonth ? d.toLocaleDateString('en-GB', { month: 'short' }) : null,
  };
}
function fmtRelativeTime(date) {
  if (!date) return '';
  const secs = Math.floor((Date.now() - date.getTime()) / 1000);
  if (secs < 60) return 'just now';
  if (secs < 3600) return `${Math.floor(secs / 60)} min ago`;
  return `${Math.floor(secs / 3600)}h ago`;
}
function isWeekend(iso) {
  const d = new Date(iso); return d.getDay() === 0 || d.getDay() === 6;
}

/* ── Sidebar ── */
function Sidebar() {
  const initials = USERNAME.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) || USERNAME[0].toUpperCase();
  return (
    <aside className="sidebar">
      <div className="logo">
        <div className="logo-mark">T</div>
        <div>
          <div className="logo-name">Trust</div>
          <div className="logo-sub">Availability</div>
        </div>
      </div>
      <div className="nav-section">Tools</div>
      <a href="/" className="nav-link active">
        {Ic.calendar}
        <span>Who's Free</span>
      </a>
      {ROLE === 'admin' && (
        <>
          <div className="nav-section">Admin</div>
          <a href="/admin/users" className="nav-link">
            {Ic.user}
            <span>Manage Users</span>
          </a>
        </>
      )}
      <div className="sidebar-footer">
        <div className="user-row">
          <div className="user-avatar">{initials}</div>
          <div>
            <div className="user-name">{USERNAME}</div>
            <div className="user-role">{ROLE}</div>
          </div>
          <a href="/logout" className="logout-btn">Sign out</a>
        </div>
      </div>
    </aside>
  );
}

/* ── Day cell ── */
function DayCell({ slots, onClick, selected, dayIso, compact }) {
  const compactCls = compact ? ' compact' : '';
  if (isWeekend(dayIso) && (!slots || slots.length === 0)) {
    return (
      <td>
        <div className={`day-cell weekend${compactCls}`}>
          {!compact && <div className="day-count" style={{fontSize:11}}>Weekend</div>}
        </div>
      </td>
    );
  }
  if (!slots || slots.length === 0) return <td><div className={`day-cell full${compactCls}`}><div className="day-count">—</div></div></td>;
  const free   = slots.filter(s => s.status === 'free').length;
  const booked = slots.filter(s => s.status === 'booked').length;
  const off    = slots.every(s => s.status === 'off');
  let cls = 'day-cell';
  if (off)             { cls += ' off'; }
  else if (free === 0) { cls += ' full'; }
  else if (free < 4)   { cls += ' partial'; }
  else                 { cls += ' free'; }
  if (selected)  cls += ' selected';
  if (compact)   cls += ' compact';
  const title = `${free} free · ${booked} booked — click to see slots`;
  return (
    <td>
      <div className={cls} onClick={onClick} title={title}>
        <div className="day-count">{off ? '—' : free}</div>
        {!compact && <div className="day-label">{off ? 'Off' : `${free} free${booked ? ` · ${booked} bkd` : ''}`}</div>}
      </div>
    </td>
  );
}

/* ── Slot drawer ── */
function SlotDrawer({ rep, dayIso, slots, onClose, onCopy }) {
  return (
    <div className="drawer">
      <div className="drawer-header">
        <div>
          <div className="drawer-title">{rep.name} · {fmtDate(dayIso)}</div>
          <div className="drawer-sub">{rep.regions?.join(', ')}</div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={onClose}>{Ic.close}</button>
      </div>
      <div className="slot-grid">
        {slots.map(slot => (
          <div key={slot.time} className={`slot ${slot.status}`}
            onClick={() => slot.status === 'free' && onCopy(`${rep.name} · ${fmtDate(dayIso)} · ${slot.time}`)}>
            {slot.time}
            {slot.status === 'booked' && slot.subject && (
              <span className="slot-copy" style={{color:'var(--muted)'}} title={slot.subject}>booked</span>
            )}
            {slot.status === 'free' && <span className="slot-copy">tap to copy</span>}
          </div>
        ))}
      </div>
    </div>
  );
}

const DAYS_FOR_VIEW = { week: 7, month: 35 };

/* ── Main App ── */
function App() {
  const [location, setLocation] = useState('');
  const [resolvedRegion, setResolvedRegion] = useState(null);
  const [manualRegion, setManualRegion] = useState('');
  const [view, setView] = useState('week'); // 'week' | 'month'
  const [startDate, setStartDate] = useState(''); // '' = today, ISO string = custom
  const [grid, setGrid] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [selected, setSelected] = useState(null); // {repName, day}
  const [copied, setCopied] = useState(null);
  const [lastRefresh, setLastRefresh] = useState(null);
  const [tick, setTick] = useState(0);
  useEffect(() => { const id = setInterval(() => setTick(t => t+1), 30000); return () => clearInterval(id); }, []);
  const resolveTimer = useRef(null);

  const activeRegion = manualRegion || resolvedRegion || null;

  // resolve postcode/city as user types
  useEffect(() => {
    clearTimeout(resolveTimer.current);
    if (!location.trim()) { setResolvedRegion(null); return; }
    resolveTimer.current = setTimeout(() => {
      fetch(`/api/resolve-location?q=${encodeURIComponent(location)}`)
        .then(r => r.json())
        .then(d => { setResolvedRegion(d.region || null); setManualRegion(''); })
        .catch(() => {});
    }, 400);
  }, [location]);

  function buildUrl(region, v, sd) {
    let url = `/api/availability?region=${encodeURIComponent(region)}&days=${DAYS_FOR_VIEW[v]}`;
    if (sd) url += `&start_date=${sd}`;
    return url;
  }

  // fetch grid whenever region, view, or startDate changes
  useEffect(() => {
    if (!activeRegion) { setGrid(null); return; }
    setLoading(true); setError(null);
    setSelected(null);
    fetch(buildUrl(activeRegion, view, startDate))
      .then(r => r.json())
      .then(d => {
        if (d.error) throw new Error(d.error);
        setGrid(d);
        setLastRefresh(new Date());
      })
      .catch(e => setError(e.message))
      .finally(() => setLoading(false));
  }, [activeRegion, view, startDate]);

  function handleRefresh() {
    fetch('/api/availability/refresh').then(() => {
      if (activeRegion) setLoading(true);
      fetch(buildUrl(activeRegion, view, startDate))
        .then(r => r.json())
        .then(d => { setGrid(d); setLastRefresh(new Date()); })
        .finally(() => setLoading(false));
    });
  }

  function handleCopy(text) {
    navigator.clipboard.writeText(text).catch(() => {});
    setCopied(text);
    setTimeout(() => setCopied(null), 2200);
  }

  const dates = grid?.dates || [];
  const reps = grid?.reps || [];
  const regionalReps = reps.filter(r => !r.is_fallback);
  const fallbackReps = reps.filter(r => r.is_fallback);

  // calculate stats
  const totalFree = regionalReps.reduce((acc, r) =>
    acc + (dates[0] ? (r.days?.[dates[0]] || []).filter(s => s.status === 'free').length : 0), 0);
  const totalBooked = regionalReps.reduce((acc, r) =>
    acc + (dates[0] ? (r.days?.[dates[0]] || []).filter(s => s.status === 'booked').length : 0), 0);

  const selectedRep = selected ? reps.find(r => r.name === selected.repName) : null;
  const selectedSlots = selected && selectedRep ? (selectedRep.days?.[selected.day] || []) : [];

  return (
    <div className="layout">
      <Sidebar />
      <main className="main">
        <div className="page-header">
          <div>
            <div className="page-title">Who's Free</div>
            {lastRefresh && (
              <div style={{fontSize:12,color:'var(--muted)',marginTop:3}}>
                Updated {fmtRelativeTime(lastRefresh)}
              </div>
            )}
          </div>
          <div className="header-actions">
            <div className="view-toggle">
              <button
                className={`btn btn-sm ${view === 'week' ? 'btn-primary' : 'btn-ghost'}`}
                onClick={() => setView('week')}>
                Week
              </button>
              <button
                className={`btn btn-sm ${view === 'month' ? 'btn-primary' : 'btn-ghost'}`}
                onClick={() => setView('month')}>
                Month
              </button>
            </div>
            <input
              type="date"
              className={`date-btn${startDate ? ' date-active' : ''}`}
              min={TODAY_ISO}
              value={startDate}
              title="Jump to a specific date"
              onChange={e => { setStartDate(e.target.value); setSelected(null); }}
            />
            {startDate && (
              <button className="btn btn-ghost btn-sm" onClick={() => setStartDate('')} title="Back to today">
                × Today
              </button>
            )}
            <button className="btn btn-ghost" onClick={handleRefresh} disabled={loading}>
              {Ic.refresh} Refresh
            </button>
          </div>
        </div>

        {/* Search bar */}
        <div className="search-bar">
          <div className="search-field" style={{flex:2,minWidth:200}}>
            <label>Customer postcode or city</label>
            <input
              className="search-input"
              placeholder="e.g. LS1, Sheffield, Manchester..."
              value={location}
              onChange={e => setLocation(e.target.value)}
            />
            {resolvedRegion && !manualRegion && (
              <div className="region-resolved">
                {Ic.locate} Matched: <strong>{resolvedRegion}</strong>
              </div>
            )}
          </div>
          <div className="divider-v"/>
          <div className="search-field" style={{flex:1.5}}>
            <label>Region</label>
            <select
              className="search-input"
              value={manualRegion || activeRegion || ''}
              onChange={e => { setManualRegion(e.target.value); setLocation(''); setResolvedRegion(null); }}>
              <option value="">— select region —</option>
              {INITIAL_REGIONS.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
          </div>
          {activeRegion && (
            <div style={{display:'flex',alignItems:'flex-end',paddingBottom:1}}>
              <span className="region-badge">{activeRegion}</span>
            </div>
          )}
        </div>

        {!activeRegion && !loading && (
          <div style={{textAlign:'center',color:'var(--muted)',padding:'60px 0',fontSize:14}}>
            Enter a postcode, city, or select a region to see availability.
          </div>
        )}

        {loading && (
          <div className="loader">
            <div className="spinner"/>
            <span>Loading calendar…</span>
          </div>
        )}
        {error && <div className="err">Error: {error}</div>}

        {!loading && !error && grid && (
          <>
            {/* Stats */}
            <div className="stats-bar">
              {!startDate && (
                <>
                  <div className="stat-chip">
                    <div className="stat-dot free"/>
                    <div className="stat-label">Free slots today</div>
                    <div className="stat-val">{totalFree}</div>
                  </div>
                  <div className="stat-chip">
                    <div className="stat-dot booked"/>
                    <div className="stat-label">Booked today</div>
                    <div className="stat-val">{totalBooked}</div>
                  </div>
                </>
              )}
              {startDate && (
                <div className="stat-chip">
                  <div className="stat-dot" style={{background:'var(--indigo)'}}/>
                  <div className="stat-label">Showing from</div>
                  <div className="stat-val">{fmtDate(startDate)}</div>
                </div>
              )}
              <div className="stat-chip">
                <div className="stat-dot" style={{background:'var(--indigo)'}}/>
                <div className="stat-label">Reps in region</div>
                <div className="stat-val">{regionalReps.length}</div>
              </div>
            </div>

            {/* Slot drawer (shown when a cell is clicked) */}
            {selected && selectedRep && (
              <SlotDrawer
                rep={selectedRep}
                dayIso={selected.day}
                slots={selectedSlots}
                onClose={() => setSelected(null)}
                onCopy={handleCopy}
              />
            )}

            <div className="grid-wrap">
              <table className={`avail-table${view === 'month' ? ' month-view' : ''}`}>
                <thead>
                  <tr>
                    <th>Rep</th>
                    {view === 'week'
                      ? dates.map(d => (
                          <th key={d} style={d === TODAY_ISO ? {
                            background:'var(--indigo-soft)',color:'var(--indigo)',
                            borderRadius:'6px',fontWeight:700
                          } : {}}>
                            {d === TODAY_ISO ? '▸ ' : ''}{fmtDateShort(d)}
                          </th>
                        ))
                      : dates.map((d, i) => {
                          const { day, weekday, monthLabel } = fmtMonthHeader(d, dates[i - 1]);
                          const isToday = d === TODAY_ISO;
                          return (
                            <th key={d} style={isToday ? {
                              background:'var(--indigo-soft)',color:'var(--indigo)',borderRadius:'6px'
                            } : {}}>
                              {monthLabel && <div className="th-month-label">{monthLabel}</div>}
                              <div className="th-day-num" style={isToday ? {color:'var(--indigo)'} : {}}>{isToday ? '▸ ' : ''}{day}</div>
                              <div className="th-weekday">{weekday}</div>
                            </th>
                          );
                        })
                    }
                  </tr>
                </thead>
                <tbody>
                  {regionalReps.map(rep => (
                    <tr key={rep.name}>
                      <td>
                        <div className="rep-cell">
                          <div className="rep-name">{rep.name}</div>
                          <div className="rep-region">{rep.regions?.join(', ')}</div>
                          {rep.is_freelancer && <div className="rep-freelancer">Freelancer / Ambivo</div>}
                          {view === 'week' && rep.today_count > 0 && (
                            <div style={{fontSize:11,color:'var(--muted)',marginTop:1}}>
                              {rep.today_count} booked today
                            </div>
                          )}
                        </div>
                      </td>
                      {dates.map(d => (
                        <DayCell
                          key={d}
                          dayIso={d}
                          compact={view === 'month'}
                          slots={rep.days?.[d]}
                          selected={selected?.repName === rep.name && selected?.day === d}
                          onClick={() => setSelected(
                            selected?.repName === rep.name && selected?.day === d
                              ? null : { repName: rep.name, day: d }
                          )}
                        />
                      ))}
                    </tr>
                  ))}

                  {/* Fallback reps section */}
                  {fallbackReps.length > 0 && (
                    <>
                      <tr className="row-divider"><td colSpan={dates.length + 1}/></tr>
                      <tr className="row-divider-label">
                        <td colSpan={dates.length + 1}>No regional rep — escalation options</td>
                      </tr>
                      {fallbackReps.map(rep => (
                        <tr key={rep.name}>
                          <td>
                            <div className="rep-cell">
                              <div className="rep-name">{rep.name}</div>
                              <div className="rep-fallback">Flexible coverage</div>
                            </div>
                          </td>
                          {dates.map(d => (
                            <DayCell
                              key={d}
                              dayIso={d}
                              compact={view === 'month'}
                              slots={rep.days?.[d]}
                              selected={selected?.repName === rep.name && selected?.day === d}
                              onClick={() => setSelected(
                                selected?.repName === rep.name && selected?.day === d
                                  ? null : { repName: rep.name, day: d }
                              )}
                            />
                          ))}
                        </tr>
                      ))}
                    </>
                  )}
                </tbody>
              </table>
            </div>
          </>
        )}

        {copied && <div className="copied-toast">Copied: {copied}</div>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
{% endraw %}
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Trust Availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --bg:#F2F3F7; --panel:#FFFFFF; --ink:#171A2B; --ink2:#3B3F55;
    --muted:#9AA0B4; --line:#EDEEF3;
    --indigo:#5B6CFF; --indigo-soft:#EEF0FF;
    --rose:#FF6B7A; --rose-soft:#FFE9EC;
    --shadow-md:0 8px 24px rgba(20,23,40,.08);
    --shadow-lg:0 12px 40px rgba(20,23,40,.10);
  }
  html,body{
    background:var(--bg); color:var(--ink);
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    font-size:14px; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  .card{
    background:var(--panel); border-radius:18px;
    box-shadow:var(--shadow-lg); padding:40px 36px;
    width:100%; max-width:380px;
  }
  .logo{
    display:flex; align-items:center; gap:12px; margin-bottom:28px;
  }
  .logo-mark{
    width:40px; height:40px; border-radius:11px;
    background:linear-gradient(135deg,#5B6CFF 0%,#8B5CF6 100%);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:17px;
    box-shadow:0 5px 12px rgba(91,108,255,.35);
  }
  .logo-text{ font-weight:700; font-size:17px; letter-spacing:-.3px; }
  .logo-sub{ font-size:12px; color:var(--muted); font-weight:500; }
  h1{ font-size:20px; font-weight:700; letter-spacing:-.4px; margin-bottom:6px; }
  .subtitle{ color:var(--muted); font-size:13.5px; margin-bottom:26px; }
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink2); margin-bottom:6px; }
  input[type=text], input[type=password]{
    width:100%; padding:11px 14px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--bg);
    font-family:inherit; font-size:14px; color:var(--ink);
    outline:none; transition:border-color .15s;
    margin-bottom:16px;
  }
  input:focus{ border-color:var(--indigo); }
  .btn{
    width:100%; padding:12px; border-radius:10px; border:none;
    background:linear-gradient(135deg,#5B6CFF 0%,#8B5CF6 100%);
    color:#fff; font-family:inherit; font-size:14px; font-weight:600;
    cursor:pointer; box-shadow:0 5px 16px rgba(91,108,255,.30);
    transition:opacity .15s;
  }
  .btn:hover{ opacity:.9; }
  .error{
    background:var(--rose-soft); color:#c0392b; border-radius:9px;
    padding:10px 14px; font-size:13px; font-weight:500;
    margin-bottom:18px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">T</div>
    <div>
      <div class="logo-text">Trust Availability</div>
      <div class="logo-sub">Internal tool</div>
    </div>
  </div>
  <h1>Sign in</h1>
  <p class="subtitle">Telesales &amp; management only</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" class="btn">Sign in</button>
  </form>
</div>
</body>
</html>

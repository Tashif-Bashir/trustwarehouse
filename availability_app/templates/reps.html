<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="7PeCuC5LSW6NNok4mmSGDYVnGKlYtLlcFVjUtfQT5Rw" />
<title>Rep Diary — Trust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F2F3F7;--panel:#FFFFFF;--ink:#171A2B;--ink2:#3B3F55;
    --muted:#9AA0B4;--muted2:#C7CADA;--line:#EDEEF3;--line2:#E5E7EF;
    --indigo:#5B6CFF;--indigo-soft:#EEF0FF;
    --violet:#8B5CF6;--violet-soft:#F2EDFF;
    --mint:#3DD0A4;--mint-soft:#E2F8EF;
    --rose:#FF6B7A;--rose-soft:#FFE9EC;
    --amber:#F5B544;--amber-soft:#FFF4DC;
    --shadow-sm:0 1px 3px rgba(20,23,40,.05);
    --shadow-md:0 8px 24px rgba(20,23,40,.08);
  }
  html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}

  .layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  .sidebar{background:var(--panel);border-right:1px solid var(--line);padding:22px 0;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 18px 24px}
  .logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5B6CFF,#8B5CF6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;box-shadow:0 5px 12px rgba(91,108,255,.3);flex-shrink:0}
  .logo-name{font-weight:700;font-size:15px;letter-spacing:-.2px}
  .logo-sub{font-size:11px;color:var(--muted);font-weight:500}
  .nav-section{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);padding:6px 18px;font-weight:600;margin-top:8px}
  .nav-link{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:10px;margin:1px 8px;font-size:13.5px;font-weight:500;color:var(--ink2);transition:all .15s;text-decoration:none}
  .nav-link:hover{background:var(--bg);color:var(--ink)}
  .nav-link.active{background:linear-gradient(135deg,#5B6CFF,#8B5CF6);color:#fff;box-shadow:0 6px 18px rgba(91,108,255,.28)}
  .nav-link.active svg{color:#fff!important}
  .nav-link svg{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
  .sidebar-footer{margin-top:auto;padding:16px 18px;border-top:1px solid var(--line)}
  .user-row{display:flex;align-items:center;gap:10px;font-size:13px}
  .user-avatar{width:30px;height:30px;border-radius:8px;background:var(--indigo-soft);color:var(--indigo);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
  .user-photo{width:30px;height:30px;border-radius:8px;object-fit:cover;flex-shrink:0}
  .user-name{font-weight:600;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user-role{font-size:11px;color:var(--muted)}
  .logout-btn{font-size:12px;color:var(--muted);font-weight:500;text-decoration:none;padding:4px 8px;border-radius:6px;margin-left:auto;flex-shrink:0}
  .logout-btn:hover{background:var(--rose-soft);color:var(--rose)}

  .main{padding:18px 24px 40px;min-width:0;overflow:hidden;display:flex;flex-direction:column}
  .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:16px;flex-wrap:wrap}
  .page-title{font-size:22px;font-weight:700;letter-spacing:-.4px}
  .header-actions{display:flex;align-items:center;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
  .btn-ghost{background:var(--panel);color:var(--ink2);box-shadow:var(--shadow-sm)}
  .btn-ghost:hover{box-shadow:var(--shadow-md);color:var(--ink)}
  .btn-ghost.active-filter{background:var(--indigo-soft);color:var(--indigo);box-shadow:none}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
  select.range-select{padding:7px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel);font-family:inherit;font-size:13px;color:var(--ink2);outline:none;font-weight:600;box-shadow:var(--shadow-sm);cursor:pointer}
  select.range-select:focus{border-color:var(--indigo)}

  .loader{display:flex;align-items:center;gap:10px;padding:40px 0;color:var(--muted);font-size:13.5px;justify-content:center}
  .spinner{width:18px;height:18px;border:2.5px solid var(--line2);border-top-color:var(--indigo);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{background:var(--rose-soft);color:var(--rose);padding:12px 16px;border-radius:10px;font-size:13.5px}

  /* Diary layout */
  .diary-wrap{display:flex;gap:14px;flex:1;min-height:0;overflow:hidden}
  .rep-list{width:220px;flex-shrink:0;background:var(--panel);border-radius:14px;box-shadow:var(--shadow-sm);overflow-y:auto;padding:8px}
  .rep-item{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;border:none;background:none;transition:all .13s;margin-bottom:2px}
  .rep-item:hover{background:var(--bg)}
  .rep-item.active{background:var(--indigo-soft)}
  .rep-item-name{font-size:13px;font-weight:600;color:var(--ink)}
  .rep-item.active .rep-item-name{color:var(--indigo)}
  .rep-item-region{font-size:11px;color:var(--muted);margin-top:1px}
  .rep-item-counts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
  .cnt-up{font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--mint-soft);color:#1a7a5a}
  .cnt-past{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--bg);color:var(--muted)}
  .cnt-fl{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--violet-soft);color:var(--violet)}

  /* Timeline */
  .diary-main{flex:1;min-width:0;overflow-y:auto}
  .tl-card{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-sm);padding:20px 24px}
  .tl-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
  .tl-rep-name{font-size:17px;font-weight:700;letter-spacing:-.3px}
  .tl-rep-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .tl-filter-badge{display:inline-flex;align-items:center;gap:5px;margin-top:5px;background:var(--indigo-soft);color:var(--indigo);font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px}
  .tl-filter-badge button{font-size:13px;line-height:1;color:var(--indigo);opacity:.7;padding:0 0 0 2px}
  .tl-filter-badge button:hover{opacity:1}
  .tl-totals{display:flex;gap:12px}
  .tl-total{text-align:right}
  .tl-total-num{font-size:18px;font-weight:700;color:var(--ink)}
  .tl-total-label{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}

  /* Appointment rows */
  .appt-list{display:flex;flex-direction:column}
  .appt-row{display:flex;align-items:center;gap:14px;padding:9px 8px;border-radius:8px;transition:background .12s}
  .appt-row:hover{background:var(--bg)}
  .appt-row.past{opacity:1}
  .appt-row.today{background:var(--indigo-soft);padding:9px 12px}
  .appt-row.today:hover{background:var(--indigo-soft)}
  .appt-date{font-size:12px;font-weight:700;color:var(--ink2);min-width:100px;flex-shrink:0}
  .appt-row.past .appt-date{color:var(--ink2)}
  .appt-row.today .appt-date{color:var(--indigo)}
  .appt-time{font-size:12px;font-weight:600;color:var(--muted);min-width:110px;flex-shrink:0;font-variant-numeric:tabular-nums}
  .appt-row.past .appt-time{color:var(--ink2);opacity:.8}
  .appt-row.today .appt-time{color:var(--indigo);opacity:.8}
  .appt-subject{font-size:13.5px;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .appt-row.past .appt-subject{color:var(--ink2)}
  .appt-row.today .appt-subject{font-weight:600;color:var(--indigo)}

  .today-divider{display:flex;align-items:center;gap:10px;padding:14px 0 10px;font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--indigo)}
  .today-divider::before,.today-divider::after{content:'';flex:1;height:1px;background:var(--indigo-soft)}

  .tl-empty{text-align:center;color:var(--muted);padding:40px 0;font-size:13.5px}
  .tl-section-label{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
  .tl-no-select{display:flex;align-items:center;justify-content:center;height:200px;color:var(--muted);font-size:14px}

  /* Calendar picker */
  .cal-anchor{position:relative}
  .cal-popup{position:absolute;top:calc(100% + 8px);right:0;background:var(--panel);border-radius:16px;box-shadow:var(--shadow-md);padding:18px;z-index:200;width:284px;border:1px solid var(--line)}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-month-label{font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
  .cal-nav-btn{font-size:17px;font-weight:700;color:var(--muted);padding:3px 9px;border-radius:7px;line-height:1}
  .cal-nav-btn:hover{background:var(--bg);color:var(--ink)}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
  .cal-wd{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase;letter-spacing:.4px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-day{text-align:center;padding:7px 0;font-size:12.5px;font-weight:500;border-radius:8px;cursor:pointer;color:var(--ink2);user-select:none}
  .cal-day:hover:not(.cal-day-grey){background:var(--bg)}
  .cal-day-grey{color:var(--muted2);cursor:default}
  .cal-day-today{font-weight:700;color:var(--indigo)}
  .cal-day-sel{background:linear-gradient(135deg,#5B6CFF,#8B5CF6)!important;color:#fff!important;font-weight:700;border-radius:8px}
  .cal-day-range{background:var(--indigo-soft);color:var(--indigo);border-radius:0}
  .cal-day-range-start{border-radius:8px 0 0 8px}
  .cal-day-range-end{border-radius:0 8px 8px 0}
  .cal-hint{font-size:11.5px;color:var(--muted);text-align:center;margin:10px 0 4px;min-height:16px}
  .cal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .cal-btn-clear{font-size:12.5px;color:var(--muted);font-weight:600;padding:6px 10px;border-radius:7px}
  .cal-btn-clear:hover{background:var(--bg);color:var(--ink)}
  .cal-btn-apply{font-size:12.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,#5B6CFF,#8B5CF6);border:none;border-radius:8px;padding:7px 16px}
  .cal-btn-apply:disabled{opacity:.4;cursor:default}

  /* Cancel appointment */
  .appt-cancel{flex-shrink:0;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 10px;border-radius:7px;border:1.5px solid var(--line);background:var(--panel);transition:all .12s;opacity:0}
  .appt-row:hover .appt-cancel{opacity:1}
  .appt-cancel:hover{background:var(--rose-soft);color:var(--rose);border-color:var(--rose-soft)}
  .appt-row.today .appt-cancel{opacity:1;background:#fff}
  .btn-danger{background:var(--rose);color:#fff;box-shadow:0 5px 14px rgba(255,107,122,.32)}
  .btn-danger:hover{opacity:.92}
  .btn-danger:disabled{opacity:.5;cursor:default}
  .cancel-overlay{position:fixed;inset:0;background:rgba(20,23,40,.45);display:flex;align-items:center;justify-content:center;z-index:300;animation:fadeIn .15s ease-out}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .cancel-box{background:var(--panel);border-radius:18px;padding:26px;max-width:400px;width:90%;box-shadow:var(--shadow-md)}
  .cancel-title{font-size:16px;font-weight:700;letter-spacing:-.2px;margin-bottom:12px}
  .cancel-detail{font-size:13.5px;color:var(--ink2);line-height:1.5}
  .cancel-warn{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:12px;line-height:1.45}
  .cancel-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow-md);z-index:400;cursor:pointer;max-width:90%;animation:fadeIn .15s ease-out}
</style>
</head>

<div id="root"></div>
<script>
const ROLE = {{ role | tojson }};
const USERNAME = {{ username | tojson }};
const USER_EMAIL = {{ user_email | tojson }};
const PHOTO_URL = {{ photo_url | tojson }};
</script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef } = React;

const Ic = {
  calendar: <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7"><rect x="3" y="4" width="14" height="14" rx="3"/><path d="M3 8h14M7 2v4M13 2v4"/></svg>,
  refresh:  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="M4 4a8 8 0 1 1 0 12"/><path d="M4 8V4H0"/></svg>,
  user:     <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7"><circle cx="10" cy="7" r="3.5"/><path d="M3 17c0-3.3 3.1-6 7-6s7 2.7 7 6"/></svg>,
  team:     <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7"><circle cx="6.5" cy="7" r="2.5"/><path d="M1 16c0-2.8 2.4-5 5.5-5"/><circle cx="13.5" cy="6" r="2.5"/><path d="M9 16c0-2.8 2.4-5 5.5-5s5.5 2.2 5.5 5"/></svg>,
  list:     <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="M7 5h10M7 10h10M7 15h10M3 5h.01M3 10h.01M3 15h.01"/></svg>,
  x:        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 5l10 10M15 5L5 15"/></svg>,
};

const TODAY_ISO = new Date().toISOString().slice(0, 10);
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function fmtRelativeTime(d) {
  const s = Math.floor((new Date() - d) / 1000);
  if (s < 60)  return 'just now';
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

function fmtIso(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

const initials = USERNAME.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);

/* ── Calendar picker ── */
function CalendarPicker({ initialRange, onApply, onClear }) {
  const today = new Date();
  const [viewYear,  setViewYear]  = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [pickA,     setPickA]     = useState(initialRange?.start || null);
  const [pickB,     setPickB]     = useState(initialRange?.end !== initialRange?.start ? initialRange?.end : null);
  const [hover,     setHover]     = useState(null);

  function isoOf(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function prevMonth() {
    if (viewMonth === 0) { setViewYear(y => y-1); setViewMonth(11); }
    else setViewMonth(m => m-1);
  }
  function nextMonth() {
    if (viewMonth === 11) { setViewYear(y => y+1); setViewMonth(0); }
    else setViewMonth(m => m+1);
  }

  function handleDayClick(iso) {
    if (!pickA || (pickA && pickB)) {
      setPickA(iso); setPickB(null);
    } else {
      if (iso >= pickA) setPickB(iso);
      else { setPickA(iso); setPickB(null); }
    }
  }

  const rangeEnd = pickB || hover;
  const lo = pickA && rangeEnd ? (pickA <= rangeEnd ? pickA : rangeEnd) : pickA;
  const hi = pickA && rangeEnd ? (pickA <= rangeEnd ? rangeEnd : pickA) : pickA;

  function inRange(iso)   { return lo && hi && iso > lo && iso < hi; }
  function isStart(iso)   { return iso === lo && lo !== hi; }
  function isEnd(iso)     { return iso === hi && lo !== hi; }
  function isSingle(iso)  { return iso === lo && lo === hi; }

  // build grid
  const firstDow = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7; // Mon=0
  const numDays  = new Date(viewYear, viewMonth + 1, 0).getDate();
  const prevDays = new Date(viewYear, viewMonth, 0).getDate();
  const cells = [];
  for (let i = firstDow - 1; i >= 0; i--)
    cells.push({ iso: null, label: prevDays - i, grey: true });
  for (let d = 1; d <= numDays; d++)
    cells.push({ iso: isoOf(viewYear, viewMonth, d), label: d, grey: false });
  let nx = 1;
  while (cells.length % 7 !== 0)
    cells.push({ iso: null, label: nx++, grey: true });

  const hint = !pickA ? 'Click a date, or click two to pick a range'
             : !pickB ? 'Click the end date (or same date for single day)'
             : `${fmtIso(lo)} – ${fmtIso(hi)}`;

  return (
    <div className="cal-popup" onClick={e => e.stopPropagation()}>
      <div className="cal-nav">
        <button className="cal-nav-btn" onClick={prevMonth}>‹</button>
        <span className="cal-month-label">{MONTH_NAMES[viewMonth]} {viewYear}</span>
        <button className="cal-nav-btn" onClick={nextMonth}>›</button>
      </div>
      <div className="cal-weekdays">
        {['Mo','Tu','We','Th','Fr','Sa','Su'].map(w => <div key={w} className="cal-wd">{w}</div>)}
      </div>
      <div className="cal-grid">
        {cells.map((cell, i) => {
          if (cell.grey) return <div key={i} className="cal-day cal-day-grey">{cell.label}</div>;
          const { iso } = cell;
          let cls = 'cal-day';
          if (isSingle(iso))     cls += ' cal-day-sel';
          else if (isStart(iso)) cls += ' cal-day-sel cal-day-range-start';
          else if (isEnd(iso))   cls += ' cal-day-sel cal-day-range-end';
          else if (inRange(iso)) cls += ' cal-day-range';
          if (iso === TODAY_ISO && !isSingle(iso) && !isStart(iso) && !isEnd(iso) && !inRange(iso))
            cls += ' cal-day-today';
          return (
            <div
              key={iso}
              className={cls}
              onClick={() => handleDayClick(iso)}
              onMouseEnter={() => { if (pickA && !pickB) setHover(iso); }}
              onMouseLeave={() => setHover(null)}>
              {cell.label}
            </div>
          );
        })}
      </div>
      <div className="cal-hint">{hint}</div>
      <div className="cal-footer">
        <button className="cal-btn-clear" onClick={onClear}>Clear filter</button>
        <button
          className="cal-btn-apply"
          disabled={!pickA}
          onClick={() => onApply({ start: lo, end: pickB ? hi : lo })}>
          Apply
        </button>
      </div>
    </div>
  );
}

/* ── Sidebar ── */
function Sidebar() {
  return (
    <aside className="sidebar">
      <div className="logo">
        <div className="logo-mark">T</div>
        <div>
          <div className="logo-name">Trust</div>
          <div className="logo-sub">Availability</div>
        </div>
      </div>
      <div className="nav-section">Tools</div>
      <a href="/" className="nav-link">{Ic.calendar}<span>Who's Free</span></a>
      <a href="/reps" className="nav-link active">{Ic.list}<span>Rep Diary</span></a>
      {ROLE === 'admin' && <>
        <div className="nav-section">Admin</div>
        <a href="/admin/users" className="nav-link">{Ic.user}<span>Manage Users</span></a>
        <a href="/admin/reps" className="nav-link">{Ic.team}<span>Manage Reps</span></a>
      </>}
      <a href="/profile" className="nav-link">{Ic.user}<span>Profile</span></a>
      <div className="sidebar-footer">
        <div className="user-row">
          {PHOTO_URL
            ? <img src={PHOTO_URL} className="user-photo" alt={USERNAME} />
            : <div className="user-avatar">{initials}</div>
          }
          <div>
            <div className="user-name">{USERNAME}</div>
            <div className="user-role">{ROLE}</div>
          </div>
          <a href="/logout" className="logout-btn">Sign out</a>
        </div>
      </div>
    </aside>
  );
}

/* ── Rep list (left panel) ── */
function RepList({ reps, selected, onSelect }) {
  return (
    <div className="rep-list">
      {reps.map(rep => {
        const upcoming = rep.appointments.filter(a => !a.is_past && !a.is_today).length;
        const today_n  = rep.appointments.filter(a => a.is_today).length;
        const past_n   = rep.appointments.filter(a => a.is_past).length;
        const total_up = upcoming + today_n;
        return (
          <button
            key={rep.name}
            className={`rep-item${rep.name === selected ? ' active' : ''}`}
            onClick={() => onSelect(rep.name)}>
            <div className="rep-item-name">{rep.name}</div>
            <div className="rep-item-region">
              {rep.is_fallback ? 'Flexible coverage' : (rep.regions?.join(', ') || '—')}
            </div>
            <div className="rep-item-counts">
              {total_up > 0 && <span className="cnt-up">{total_up} upcoming</span>}
              {today_n  > 0 && <span className="cnt-up" style={{background:'var(--indigo-soft)',color:'var(--indigo)'}}>today</span>}
              {past_n   > 0 && <span className="cnt-past">{past_n} past</span>}
              {rep.is_freelancer && <span className="cnt-fl">Freelancer</span>}
            </div>
          </button>
        );
      })}
    </div>
  );
}

/* ── Single appointment row ── */
function ApptRow({ appt, onCancel }) {
  const d = new Date(appt.date + 'T00:00:00');
  const dayStr = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const kind   = appt.is_today ? 'today' : appt.is_past ? 'past' : 'future';
  return (
    <div className={`appt-row ${kind}`}>
      <div className="appt-date">{dayStr}</div>
      <div className="appt-time">{appt.start}{appt.end ? `–${appt.end}` : ''}</div>
      <div className="appt-subject" title={appt.subject}>{appt.subject || '(no title)'}</div>
      {appt.cancellable && !appt.is_past && (
        <button className="appt-cancel" onClick={() => onCancel(appt)}
          title="Cancel this appointment — removes the calendar event and reverts the CRM">
          Cancel
        </button>
      )}
    </div>
  );
}

/* ── Timeline for one rep ── */
function Timeline({ rep, filterRange, onClearFilter, onCancel }) {
  const all = rep.appointments;

  const filtered = filterRange
    ? all.filter(a => a.date >= filterRange.start && a.date <= filterRange.end)
    : all;

  const past   = filtered.filter(a => a.is_past);
  const todays = filtered.filter(a => a.is_today);
  const future = filtered.filter(a => !a.is_past && !a.is_today);
  const upcoming = todays.length + future.length;

  const filterLabel = filterRange
    ? (filterRange.start === filterRange.end
        ? fmtIso(filterRange.start)
        : `${fmtIso(filterRange.start)} – ${fmtIso(filterRange.end)}`)
    : null;

  const showTodayDivider = !filterRange ||
    (filterRange.start <= TODAY_ISO && TODAY_ISO <= filterRange.end);

  return (
    <div className="tl-card">
      <div className="tl-header">
        <div>
          <div className="tl-rep-name">{rep.name}</div>
          <div className="tl-rep-meta">
            {rep.is_fallback ? 'Flexible coverage' : rep.regions?.join(' · ')}
            {rep.is_freelancer ? ' · Freelancer / Ambivo' : ''}
          </div>
          {filterLabel && (
            <div className="tl-filter-badge">
              {Ic.calendar} {filterLabel}
              <button onClick={onClearFilter} title="Clear date filter">×</button>
            </div>
          )}
        </div>
        <div className="tl-totals">
          <div className="tl-total">
            <div className="tl-total-num" style={{color:'var(--mint)'}}>{upcoming}</div>
            <div className="tl-total-label">upcoming</div>
          </div>
          <div className="tl-total">
            <div className="tl-total-num" style={{color:'var(--muted)'}}>{past.length}</div>
            <div className="tl-total-label">past</div>
          </div>
        </div>
      </div>

      <div className="appt-list">
        {filtered.length === 0 && (
          <div className="tl-empty">
            {filterLabel ? `No appointments in this period (${filterLabel}).` : 'No appointments found in this period.'}
          </div>
        )}

        {past.length > 0 && (
          <>
            <div className="tl-section-label">Past</div>
            {past.map(a => <ApptRow key={`${a.date}-${a.start}`} appt={a} onCancel={onCancel} />)}
          </>
        )}

        {showTodayDivider && filtered.length > 0 && (
          <div className="today-divider">Today</div>
        )}

        {showTodayDivider && (
          todays.length > 0
            ? todays.map(a => <ApptRow key={`${a.date}-${a.start}`} appt={a} onCancel={onCancel} />)
            : <div className="tl-empty" style={{padding:'8px 0',fontSize:12}}>No appointments today</div>
        )}

        {future.length > 0 && (
          <>
            <div className="tl-section-label" style={{paddingTop:14}}>Upcoming</div>
            {future.map(a => <ApptRow key={`${a.date}-${a.start}`} appt={a} onCancel={onCancel} />)}
          </>
        )}
      </div>
    </div>
  );
}

/* ── Main app ── */
function App() {
  const [diary,       setDiary]       = useState(null);
  const [selectedRep, setSelectedRep] = useState(null);
  const [loading,     setLoading]     = useState(true);
  const [error,       setError]       = useState(null);
  const [daysBack,    setDaysBack]    = useState(7);
  const [lastRefresh, setLastRefresh] = useState(null);
  const [calOpen,     setCalOpen]     = useState(false);
  const [filterRange, setFilterRange] = useState(null);
  const [cancelTarget, setCancelTarget] = useState(null);
  const [cancelBusy,   setCancelBusy]   = useState(false);
  const [toast,        setToast]        = useState(null);
  const calRef = useRef(null);

  useEffect(() => { loadDiary(daysBack); }, [daysBack]);

  // close calendar on outside click
  useEffect(() => {
    if (!calOpen) return;
    function handler(e) {
      if (calRef.current && !calRef.current.contains(e.target)) setCalOpen(false);
    }
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [calOpen]);

  function loadDiary(db) {
    setLoading(true); setError(null);
    fetch(`/api/reps/diary?days_back=${db}`)
      .then(r => r.json())
      .then(d => {
        if (d.error) throw new Error(d.error);
        setDiary(d);
        setLastRefresh(new Date());
        setSelectedRep(prev => {
          if (prev && d.reps.find(r => r.name === prev)) return prev;
          return d.reps.length > 0 ? d.reps[0].name : null;
        });
      })
      .catch(e => setError(e.message))
      .finally(() => setLoading(false));
  }

  function handleRefresh() {
    fetch('/api/reps/diary/refresh').then(() => loadDiary(daysBack));
  }

  function handleCalApply(range) {
    setFilterRange(range);
    setCalOpen(false);
  }

  function handleCalClear() {
    setFilterRange(null);
    setCalOpen(false);
  }

  async function confirmCancel() {
    if (!cancelTarget) return;
    setCancelBusy(true);
    try {
      const resp = await fetch('/api/cancel', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ event_id: cancelTarget.event_id }),
      });
      const data = await resp.json();
      setToast(data.message || (data.ok ? 'Appointment cancelled.' : 'Cancel failed.'));
      setCancelTarget(null);
      if (data.ok) {
        fetch('/api/reps/diary/refresh').then(() => loadDiary(daysBack));
      }
    } catch (e) {
      setToast('Cancel failed: ' + e.message);
    } finally {
      setCancelBusy(false);
      setTimeout(() => setToast(null), 6000);
    }
  }

  const allReps = diary?.reps || [];
  const repData = allReps.find(r => r.name === selectedRep);

  const filterBtnLabel = filterRange
    ? (filterRange.start === filterRange.end
        ? fmtIso(filterRange.start)
        : `${fmtIso(filterRange.start)} – ${fmtIso(filterRange.end)}`)
    : 'Date filter';

  return (
    <div className="layout">
      <Sidebar />
      <main className="main">
        <div className="page-header">
          <div>
            <div className="page-title">Rep Diary</div>
            {lastRefresh && (
              <div style={{fontSize:12,color:'var(--muted)',marginTop:3}}>
                Updated {fmtRelativeTime(lastRefresh)}
              </div>
            )}
          </div>
          <div className="header-actions">
            <select
              className="range-select"
              value={daysBack}
              onChange={e => setDaysBack(Number(e.target.value))}>
              <option value={7}>Last 7 days</option>
              <option value={14}>Last 14 days</option>
              <option value={30}>Last 30 days</option>
              <option value={60}>Last 60 days</option>
            </select>

            {/* Calendar date filter */}
            <div className="cal-anchor" ref={calRef}>
              <button
                className={`btn btn-ghost btn-sm${filterRange ? ' active-filter' : ''}`}
                onClick={() => setCalOpen(o => !o)}>
                {Ic.calendar}
                <span>{filterBtnLabel}</span>
              </button>
              {calOpen && (
                <CalendarPicker
                  initialRange={filterRange}
                  onApply={handleCalApply}
                  onClear={handleCalClear}
                />
              )}
            </div>

            <button className="btn btn-ghost btn-sm" onClick={handleRefresh} disabled={loading}>
              {Ic.refresh} Refresh
            </button>
          </div>
        </div>

        {loading && (
          <div className="loader">
            <div className="spinner"/>
            <span>Loading calendar…</span>
          </div>
        )}
        {error && <div className="err">Error: {error}</div>}

        {!loading && !error && diary && (
          <div className="diary-wrap">
            <RepList reps={allReps} selected={selectedRep} onSelect={setSelectedRep} />
            <div className="diary-main">
              {repData
                ? <Timeline
                    rep={repData}
                    filterRange={filterRange}
                    onClearFilter={() => setFilterRange(null)}
                    onCancel={setCancelTarget}
                  />
                : <div className="tl-no-select">Select a rep to see their diary</div>
              }
            </div>
          </div>
        )}

        {cancelTarget && (
          <div className="cancel-overlay"
            onClick={e => e.target === e.currentTarget && !cancelBusy && setCancelTarget(null)}>
            <div className="cancel-box">
              <div className="cancel-title">Cancel appointment?</div>
              <div className="cancel-detail">
                <strong>{cancelTarget.subject || '(no title)'}</strong><br/>
                {selectedRep} · {fmtIso(cancelTarget.date)} · {cancelTarget.start}{cancelTarget.end ? `–${cancelTarget.end}` : ''}
              </div>
              <div className="cancel-warn">
                This removes the calendar event and reverts the lead in SharpSpring
                (status → Appointment Cancelled, owner back to the booker).
              </div>
              <div className="cancel-actions">
                <button className="btn btn-ghost" onClick={() => setCancelTarget(null)} disabled={cancelBusy}>Keep it</button>
                <button className="btn btn-danger" onClick={confirmCancel} disabled={cancelBusy}>
                  {cancelBusy ? 'Cancelling…' : 'Cancel appointment'}
                </button>
              </div>
            </div>
          </div>
        )}

        {toast && <div className="toast" onClick={() => setToast(null)}>{toast}</div>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
{% endraw %}
</body>
</html>

version: 2

models:

  - name: gold_lead_activity
    description: >
      One row per lead. Joins SharpSpring lead data with Wildix call metrics.
      Primary consumer for sales pipeline and telesales dashboards.
    columns:
      - name: lead_id
        description: SharpSpring lead ID — primary key
        tests:
          - unique
          - not_null
      - name: created_at
        description: Timestamp when the lead was created in SharpSpring (UK local)
        tests:
          - not_null
      - name: created_date
        description: UK local date of lead creation — use this for date filtering
        tests:
          - not_null
      - name: lead_status
        description: SharpSpring lead status (unqualified, qualified, contact, customer)
        tests:
          - not_null
      - name: customer_type
        description: domestic or commercial, derived from self_described_type. Null if unknown.
      - name: campaign_id
        description: SharpSpring campaign ID the lead was attributed to. Null for organic/untracked leads.
      - name: platform
        description: Paid platform (Google, Meta, or Bing) resolved from campaign_id. Null for organic or unattributed leads.
      - name: is_sold
        description: True when appointment_status is one of the four sold values
        tests:
          - not_null
      - name: has_been_called
        description: True if at least one outbound call was matched to this lead
        tests:
          - not_null
      - name: total_call_attempts
        description: Count of matched outbound completed calls
        tests:
          - not_null
      - name: qualified_conversations
        description: Calls >= 120 seconds matched to this lead
        tests:
          - not_null

  - name: gold_agent_performance_daily
    description: >
      One row per agent per calendar day. Aggregates Wildix call metrics and
      SharpSpring appointment bookings. Primary source for telesales dashboard.
    columns:
      - name: date
        description: Calendar date (UK local)
        tests:
          - not_null
      - name: agent_name
        description: Canonical agent name from Wildix colleague_name
        tests:
          - not_null
      - name: outbound_calls
        description: Completed outbound calls made by the agent on this date
        tests:
          - not_null
      - name: inbound_calls
        description: Completed inbound calls handled by the agent on this date
        tests:
          - not_null
      - name: missed_calls
        description: Missed calls attributed to this agent on this date
        tests:
          - not_null
      - name: qualified_conversations
        description: Calls >= 120 seconds (outbound + inbound) on this date
        tests:
          - not_null
      - name: appointments_booked
        description: Appointments where the agent clicked "book" in CRM on this date.
          Measures dialling activity output (when the booking was created).
        tests:
          - not_null
      - name: appointments_scheduled
        description: Appointments in the agent's diary to sit on this date,
          regardless of when they were booked. This is what the telesales
          manager compares against (the agent's pipeline for the period).
        tests:
          - not_null
      - name: appointments_sat
        description: Subset of appointments_scheduled that have a status
          indicating the meeting actually happened.
        tests:
          - not_null
      - name: appointments_sold
        description: Subset of appointments_scheduled that closed to a sale.
        tests:
          - not_null

  - name: gold_pipeline_opportunities
    description: >
      One row per SharpSpring opportunity. Joins deal stages and lead attributes.
      Provides a proper pipeline view with amounts and probability independent
      of the inconsistently-filled custom lead fields.
    columns:
      - name: opportunity_id
        description: SharpSpring opportunity ID — primary key
        tests:
          - unique
          - not_null
      - name: created_date
        description: Date the opportunity was created (UK local)
        tests:
          - not_null
      - name: is_won
        description: True when the opportunity is marked as won in SharpSpring
        tests:
          - not_null
      - name: is_closed
        description: True when the opportunity is closed (won or lost)
        tests:
          - not_null

  - name: gold_campaign_attribution
    description: >
      One row per platform per day. Joins paid ad spend (Google/Meta/Bing)
      with SharpSpring lead counts. Appointments and sales live in
      gold_lead_activity and gold_agent_performance_daily.
    columns:
      - name: date
        description: Calendar date
        tests:
          - not_null
      - name: platform
        description: Google, Meta, or Bing
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Google', 'Meta', 'Bing']
      - name: spend_gbp
        description: Total ad spend in GBP for this platform on this date
        tests:
          - not_null
      - name: leads
        description: Paid leads created on this date attributed to this platform (includes UTM-inferred)
        tests:
          - not_null
      - name: cost_per_lead
        description: spend_gbp / leads. Null when leads = 0.
      - name: click_to_lead_rate
        description: leads / clicks. Null when clicks = 0.

  - name: gold_leads_by_region
    description: >
      One row per date × region × platform. Aggregates lead counts, appointments,
      and sales by UK region derived from postcode. Use for regional performance views.
    columns:
      - name: created_date
        description: UK local date of lead creation
        tests:
          - not_null
      - name: region
        description: UK region derived from postcode prefix (falls back to SharpSpring region field, then 'Unknown')
        tests:
          - not_null
      - name: platform
        description: Paid platform (Google, Meta, Bing) or null for organic leads
      - name: leads
        description: Total leads created in this region on this date
        tests:
          - not_null
      - name: appointments
        description: Leads with appointment_booked = Yes
        tests:
          - not_null
      - name: sales
        description: Leads where is_sold = true
        tests:
          - not_null
      - name: lead_to_appt_rate
        description: appointments / leads
      - name: appt_to_sale_rate
        description: sales / appointments

  - name: gold_google_ads_spend_by_region
    description: >
      One row per date × region. Google Ads spend, clicks, and impressions
      broken down by region derived from campaign name. National campaigns
      (no regional targeting) are grouped under 'National'.
    columns:
      - name: date
        description: Campaign date
        tests:
          - not_null
      - name: region
        description: UK region parsed from campaign name, or 'National' for non-regional campaigns
        tests:
          - not_null
      - name: spend_gbp
        description: Total ad spend in GBP for this region on this date
        tests:
          - not_null
      - name: clicks
        description: Total clicks
        tests:
          - not_null
      - name: impressions
        description: Total impressions
        tests:
          - not_null

  - name: gold_lead_calls
    description: >
      One row per (call, lead) match. Wildix call data joined to SharpSpring leads
      via phone. Multi-participant silver rows (transfers, parallel pickups) collapsed
      to one row per logical call before joining. Powers heatmap, speed-to-call,
      duration-vs-conversion, and source CPA analyses.
    columns:
      - name: call_id
        description: Wildix logical call/conversation ID
        tests:
          - not_null
      - name: lead_id
        description: SharpSpring lead ID
        tests:
          - not_null
      - name: call_at
        description: Call start time (TIMESTAMP, UTC)
        tests:
          - not_null
      - name: direction
        description: OUTBOUND or INBOUND (INTERNAL filtered out)
        tests:
          - accepted_values:
              arguments:
                values: ['OUTBOUND', 'INBOUND']
      - name: call_status
        description: COMPLETED (answered) or MISSED (dial attempt without connection)
        tests:
          - accepted_values:
              arguments:
                values: ['COMPLETED', 'MISSED']
      - name: talk_time_seconds
        description: Total conversation time across all participants of this call
        tests:
          - not_null
      - name: lead_platform
        description: Hybrid platform from gold_lead_activity (CRM-first + UTM fallback)
      - name: lead_age_bucket
        description: How fresh the lead was when this call happened
        tests:
          - accepted_values:
              arguments:
                values: ['<5m','5-15m','15-60m','1-4h','4-24h','1-3d','3-7d','>7d']
      - name: is_first_call
        description: True if this is the first call placed to this lead
        tests:
          - not_null
      - name: is_qualified_call
        description: True if talk_time_seconds >= 120 (real conversation)
        tests:
          - not_null
      - name: lead_appointment_booked_at
        description: When the appointment was booked (TIMESTAMP, parsed from SharpSpring's UK-local string). Same value on every call row for a given lead.
      - name: appt_within_1h
        description: True if an appointment was booked in the hour after this call. Honest per-call attribution (lead-level flag credits every call regardless of timing).
        tests:
          - not_null
      - name: appt_within_24h
        description: True if an appointment was booked in the 24 hours after this call.
        tests:
          - not_null
      - name: appt_within_48h
        description: True if an appointment was booked in the 48 hours after this call.
        tests:
          - not_null
      - name: mins_to_appt_after_call
        description: Minutes from this call to the appointment booking. NULL if no appointment or appointment preceded the call.

  - name: gold_sales_reconciled
    description: >
      One row per genuine sale, normalised across CRM (SharpSpring), ERP (Unleashed)
      and the deposit notes — the trustworthy sales ledger that reproduces the team's
      manual sales sheet. A sale = the first deposit payment (from the notes), dated to
      its deposit month; amount = the name-matched Unleashed ex-VAT sub_total when
      available, else a provisional figure; attribution = the CRM lead owner → canonical
      rep. Validated against the June 2026 sheet (Michael/Rhiannon excluded, Karen/Pat
      included, Visa unattributed).
    columns:
      - name: customer_name
        description: Customer name (from the CRM lead or, for Unleashed-only sales, the order)
      - name: rep
        description: Canonical sales rep from sales_rep_mapping. NULL when the sale is not attributable to a tracked advisor (see is_unattributed).
      - name: team
        description: Team Fiona, Team Scott, or Standalone — from the rep mapping
      - name: sale_date
        description: Date the sale was opened (first deposit date, or Unleashed order date for Unleashed-only sales)
      - name: sale_month
        description: First day of the month the sale counts in — use this for monthly scorecards
        tests:
          - not_null
      - name: amount_ex_vat
        description: Ex-VAT sale value (Unleashed sub_total when confirmed, else provisional)
        tests:
          - not_null
      - name: is_water
        description: True if a water-cylinder sale (Unleashed "Water Heating" product group)
        tests:
          - not_null
      - name: amount_to_target
        description: amount_ex_vat minus £1,334 for water sales — the revenue-to-target contribution
        tests:
          - not_null
      - name: source
        description: "Provenance: crm+unleashed, crm_only, or unleashed_only"
        tests:
          - not_null
          - accepted_values:
              values: ['crm+unleashed', 'crm_only', 'unleashed_only']
      - name: is_provisional
        description: True when the amount is not yet confirmed by an Unleashed order (CRM/deposit-derived)
        tests:
          - not_null
      - name: is_unattributed
        description: True when no canonical rep could be assigned (e.g. closer/non-advisor owner like Visa Nallathamby)
        tests:
          - not_null

  - name: gold_sales_exceptions
    description: >
      QA review list for the sales ledger (a view) — rows where the reconciliation
      is uncertain or sources disagree, scoped to ~the last 4 months. Four types:
      pending_no_unleashed (deposit logged, ERP not caught up), unattributed (sale
      with no tracked advisor — usually a closer), attribution_conflict (CRM owner vs
      Unleashed salesperson disagree), and sold_no_money (lead flagged sold with a
      recent appointment but no deposit note and no Unleashed order — quote-as-sold
      or deposit not yet logged). Surfaces edges for human review instead of guessing.
    columns:
      - name: exception_type
        description: "pending_no_unleashed | unattributed | attribution_conflict | sold_no_money"
        tests:
          - not_null
          - accepted_values:
              values: ['pending_no_unleashed', 'unattributed', 'attribution_conflict', 'sold_no_money']
      - name: customer_name
        description: Customer the exception relates to
      - name: rep
        description: Canonical rep where known (null for unattributed sales)
      - name: sale_month
        description: Month the sale would count in (deposit month, or appointment month for sold_no_money)
      - name: amount_ex_vat
        description: Ex-VAT amount where known; null for sold_no_money (no money evidence yet)
      - name: detail
        description: Human-readable explanation of the exception

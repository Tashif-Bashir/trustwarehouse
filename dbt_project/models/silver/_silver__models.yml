version: 2

models:

  - name: silver_sharpspring_notes
    description: >
      One row per SharpSpring lead note. Notes are the team's running commentary
      (telesales script, callbacks, visit outcomes, deposits). The deposit/payment
      notes are the canonical "a sale happened" event used by gold_sales_reconciled.
    columns:
      - name: note_id
        description: SharpSpring note ID — primary key
        tests:
          - unique
          - not_null
      - name: lead_id
        description: SharpSpring lead the note belongs to (who_id)
        tests:
          - not_null
      - name: note_date
        description: UK-local date the note was written
      - name: is_payment_event
        description: True when the note records an opening deposit/payment (£ + deposit action, not a final balance)
        tests:
          - not_null
      - name: is_balance_payment
        description: True when the note is a later balance/installment payment (not the sale-opening event)
        tests:
          - not_null
      - name: amount_mentioned
        description: First £ amount in the note text (the deposit value), null if none
      - name: pct_mentioned
        description: Deposit percentage stated in the note (e.g. 50), null if none

  - name: silver_sharpspring_leads
    description: >
      One row per lead from SharpSpring bronze. Typed, cleaned, and enriched with
      derived columns (customer_type, appointment_date, is_sold). Excludes internal
      test leads (Zzz-prefixed names, "Test ..." names, bare "test") and leads
      deleted from the CRM (anti-joined against bronze.sharpspring_leads_deleted,
      owner ruling 20 Aug 2026 — deleted leads stop counting everywhere downstream)
      so every downstream consumer inherits both filters.
    columns:
      - name: lead_id
        description: SharpSpring lead ID — primary key
        tests:
          - unique
          - not_null
      - name: created_at
        description: Lead creation timestamp (SharpSpring create_timestamp)
        tests:
          - not_null
      - name: is_active
        description: False for deleted/archived leads
        tests:
          - not_null
      - name: is_sold
        description: True when appointment_status is one of the four sold values
        tests:
          - not_null
      - name: customer_type
        description: domestic or commercial, derived from self_described_type. Null if unknown.
      - name: domestic_lead_status
        description: >
          SharpSpring pipeline stage field (Appointment, Follow Up, Not Interested, etc).
          Fixed 20 Aug 2026 — was previously double-quoted so BigQuery returned the
          literal column-identifier string for every row instead of the real value.
      - name: lead_temperature
        description: >
          SharpSpring lead-warmth picklist. Fixed 20 Aug 2026 alongside domestic_lead_status
          (same double-quoting bug).
      - name: page_submitted
        description: >
          Raw "Page Submitted" URL field (page_submitted_5af30a9090796). Used as a fallback
          for exact_marketing_url when that field is empty — mirrors the marketing
          workspace's 18 Aug 2026 attribution fix.

  - name: silver_sharpspring_campaigns
    description: SharpSpring campaign definitions — one row per campaign.
    columns:
      - name: campaign_id
        description: SharpSpring campaign ID — primary key
        tests:
          - unique
          - not_null

  - name: silver_sharpspring_deal_stages
    description: SharpSpring deal/pipeline stage definitions.
    columns:
      - name: deal_stage_id
        description: Stage ID — primary key
        tests:
          - unique
          - not_null

  - name: silver_sharpspring_opportunities
    description: SharpSpring opportunities — one row per opportunity.
    columns:
      - name: opportunity_id
        description: SharpSpring opportunity ID — primary key
        tests:
          - unique
          - not_null

  - name: silver_ascend_calls
    description: >
      One row per call from Ascend (Focus Group) bronze, mapped to the same
      column contract as silver_wildix_calls so downstream models work across
      the 1 Jul 2026 phone-system cutover. Ascend duration = talk time;
      answered flag maps to COMPLETED/MISSED; IVR/voicemail endpoints get a
      NULL colleague_name so they never appear as agents.
    columns:
      - name: call_id
        description: Ascend call id (unique — one row per call, no legs).
        tests:
          - not_null
          - unique

  - name: silver_calls_unified
    description: >
      Unified call history across the phone migration — Wildix rows before
      1 Jul 2026 (legs preserved exactly as history always counted them),
      Ascend rows from 1 Jul 2026. All downstream call models read this.
    columns:
      - name: phone_system
        description: "'wildix' or 'ascend' — which side of the cutover the row is from."
        tests:
          - not_null

  - name: silver_wildix_calls
    description: >
      One row per call leg from Wildix bronze. Typed and cleaned.
      Note: a single customer call may produce multiple rows (one per leg).
      FROZEN since 1 Jul 2026 (system replaced by Ascend) — kept for history.
    columns:
      - name: call_id
        description: Wildix call ID (id field). Not unique alone — use (call_id, wms_id).
      - name: wms_id
        description: WMS instance ID. Combined with call_id forms the unique key.
      - name: call_status
        description: COMPLETED, MISSED, BUSY, etc.
        tests:
          - not_null
      - name: direction
        description: INBOUND or OUTBOUND
        tests:
          - not_null
          - accepted_values:
              values: ['INBOUND', 'OUTBOUND', 'INTERNAL']

  - name: silver_google_ads_spend
    description: Google Ads daily spend aggregated from campaign-level data.
    columns:
      - name: date
        description: Reporting date
        tests:
          - not_null
      - name: campaign_id
        tests:
          - not_null
      - name: spend_gbp
        tests:
          - not_null

  - name: silver_meta_spend
    description: Meta (Facebook/Instagram) daily spend.
    columns:
      - name: date
        tests:
          - not_null
      - name: spend_gbp
        tests:
          - not_null

  - name: silver_bing_spend
    description: Microsoft Bing Ads daily spend.
    columns:
      - name: date
        tests:
          - not_null
      - name: spend_gbp
        tests:
          - not_null

  - name: silver_meta_geographic
    description: >
      Daily Meta campaign performance broken down by UK region from the
      Meta Marketing API breakdowns parameter. rep_territory maps Meta region
      names to the company's rep coverage areas.
    columns:
      - name: date
        tests:
          - not_null
      - name: campaign_id
        tests:
          - not_null
      - name: rep_territory
        tests:
          - not_null

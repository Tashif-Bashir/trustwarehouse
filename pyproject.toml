[project]
name = "heating-warehouse"
version = "0.1.0"
description = "Medallion architecture data warehouse for heating company data"
readme = "README.md"
authors = [
    { name = "Tashif-Bashir", email = "u21744677@unimail.hud.ac.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "dlt[bigquery]",
    "google-cloud-bigquery",
    "python-dotenv",
    "pandera",
    "pydantic",
    "PyJWT",
    "dbt-core",
    "dbt-bigquery",
    "streamlit>=1.35",
    "plotly>=5.20",
    "pandas>=2.0",
    "matplotlib>=3.10.9",
    "google-analytics-data>=0.18",
    "google-ads>=25.0",
    "google-auth-oauthlib>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "black",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

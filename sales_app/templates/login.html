<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="7PeCuC5LSW6NNok4mmSGDYVnGKlYtLlcFVjUtfQT5Rw" />
<title>Sign in — Trust Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --bg:#F2F3F7; --panel:#FFFFFF; --ink:#171A2B; --ink2:#3B3F55;
    --muted:#9AA0B4; --line:#EDEEF3;
    --indigo:#5B6CFF; --indigo-soft:#EEF0FF;
    --rose:#FF6B7A; --rose-soft:#FFE9EC;
    --shadow-md:0 8px 24px rgba(20,23,40,.08);
    --shadow-lg:0 12px 40px rgba(20,23,40,.10);
  }
  html,body{
    background:var(--bg); color:var(--ink);
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    font-size:14px; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  .card{
    background:var(--panel); border-radius:18px;
    box-shadow:var(--shadow-lg); padding:40px 36px;
    width:100%; max-width:380px;
  }
  .logo{
    display:flex; align-items:center; gap:12px; margin-bottom:28px;
  }
  .logo-mark{
    width:40px; height:40px; border-radius:11px;
    background:linear-gradient(135deg,#5B6CFF 0%,#8B5CF6 100%);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:17px;
    box-shadow:0 5px 12px rgba(91,108,255,.35);
  }
  .logo-text{ font-weight:700; font-size:17px; letter-spacing:-.3px; }
  .logo-sub{ font-size:12px; color:var(--muted); font-weight:500; }
  h1{ font-size:20px; font-weight:700; letter-spacing:-.4px; margin-bottom:6px; }
  .subtitle{ color:var(--muted); font-size:13.5px; margin-bottom:26px; }
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink2); margin-bottom:6px; }
  input[type=text], input[type=password]{
    width:100%; padding:11px 14px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--bg);
    font-family:inherit; font-size:14px; color:var(--ink);
    outline:none; transition:border-color .15s;
    margin-bottom:16px;
  }
  input:focus{ border-color:var(--indigo); }
  .btn{
    width:100%; padding:12px; border-radius:10px; border:none;
    background:linear-gradient(135deg,#5B6CFF 0%,#8B5CF6 100%);
    color:#fff; font-family:inherit; font-size:14px; font-weight:600;
    cursor:pointer; box-shadow:0 5px 16px rgba(91,108,255,.30);
    transition:opacity .15s;
  }
  .btn:hover{ opacity:.9; }
  .error{
    background:var(--rose-soft); color:#c0392b; border-radius:9px;
    padding:10px 14px; font-size:13px; font-weight:500;
    margin-bottom:18px;
  }
  .pwd-wrap{position:relative;display:block}
  .pwd-wrap input{padding-right:38px !important}
  .pwd-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:2px;display:flex;align-items:center;line-height:1;margin-bottom:16px}
  .pwd-eye:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">T</div>
    <div>
      <div class="logo-text">Trust Sales</div>
      <div class="logo-sub">Internal tool</div>
    </div>
  </div>
  <h1>Sign in</h1>
  <p class="subtitle">Sales logging — reps &amp; office</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <div class="pwd-wrap">
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="button" class="pwd-eye" onclick="togglePwd(this)" tabindex="-1" aria-label="Show password">
        <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-shut" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <button type="submit" class="btn">Sign in</button>
  </form>
</div>
<script>
function togglePwd(btn){
  var inp=btn.parentElement.querySelector('input');
  var show=inp.type==='password';
  inp.type=show?'text':'password';
  btn.querySelector('.eye-open').style.display=show?'none':'';
  btn.querySelector('.eye-shut').style.display=show?'':'none';
}
</script>
</body>
</html>
